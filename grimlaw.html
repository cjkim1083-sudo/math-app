<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그림으로 푸는 건축법규 — 문제풀이</title>
<meta name="description" content="『그림으로 푸는 건축법규』 103문항 무료 문제풀이. 바로 채점, 정답 해설, 개념도는 책 쪽번호로 연결.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f4e79; --navy-deep:#163a5c; --accent:#c2703d; --ok:#2f9e5b; --no:#c0392b;
  --bg:#f4f6f9; --card:#ffffff; --ink:#22303c; --sub:#5c6b7a; --line:#d9e0e8; --tint:#eaf1f7; --warm:#fbefe3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101822; --card:#1a2532; --ink:#e8eef4; --sub:#9fb0c0; --line:#2c3a4a; --tint:#203042; --navy:#4d84b8; --navy-deep:#0e1926; --warm:#2e261e; }
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--ink); padding:0 16px 40px; min-height:100vh;}
.wrap{max-width:660px; margin:0 auto;}
header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%); color:#fff; margin:0 -16px; padding:28px 20px 24px; text-align:center;}
header .eyebrow{font-size:12.5px; letter-spacing:.12em; opacity:.85; font-weight:500;}
header h1{font-family:'Noto Serif KR',serif; font-size:25px; font-weight:900; margin-top:8px;}
header .sub{font-size:13.5px; opacity:.88; margin-top:8px; line-height:1.55;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 20px; margin-top:18px; box-shadow:0 1px 4px rgba(15,30,50,.06);}
.hidden{display:none!important;}
h2{font-size:16px; font-weight:900; margin-bottom:4px;}
.lead{font-size:14px; line-height:1.65; color:var(--sub);}
.btn{display:block; width:100%; padding:14px; margin-top:18px; font-size:16.5px; font-weight:700; font-family:inherit; color:#fff; background:var(--navy); border:none; border-radius:10px; cursor:pointer;}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--navy);}
.btn.warm{background:var(--accent);}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px;}
.ch{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font-family:inherit; cursor:pointer;}
.ch:hover{border-color:var(--navy);}
.ch b{font-family:'Noto Serif KR',serif; font-size:19px; color:var(--navy); line-height:1.1; min-width:28px;}
.ch span{font-size:13px; line-height:1.4; font-weight:700;}
.ch small{display:block; font-size:11.5px; color:var(--sub); font-weight:400; margin-top:2px;}
.ch .done{color:var(--ok); font-weight:700;}
@media (max-width:420px){ .grid{grid-template-columns:1fr;} }
.progress{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sub); font-weight:700; margin-bottom:6px;}
.bar{height:6px; background:var(--tint); border-radius:3px; overflow:hidden; margin-bottom:14px;}
.bar>div{height:100%; background:var(--navy); border-radius:3px; transition:width .3s;}
.unit{font-size:12px; color:var(--accent); font-weight:700; margin-bottom:8px;}
.qtext{font-size:16.5px; font-weight:700; line-height:1.6; margin-bottom:4px;}
.qtext .qx{display:block; margin-top:9px; font-size:14.5px; font-weight:500; color:var(--sub); border-left:3px solid var(--line); padding-left:11px; line-height:1.6;}
.opt{display:block; width:100%; text-align:left; padding:12px 14px; margin-top:9px; font-size:15px; font-family:inherit; line-height:1.5; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:10px; cursor:pointer;}
.opt:not(:disabled):hover{border-color:var(--navy);}
.opt.correct{border-color:var(--ok); background:rgba(47,158,91,.12); font-weight:700;}
.opt.wrong{border-color:var(--no); background:rgba(192,57,43,.10);}
.opt:disabled{cursor:default; opacity:.95;}
.explain{margin-top:14px; padding:14px 15px; border-left:4px solid var(--navy); background:var(--tint); border-radius:0 10px 10px 0; font-size:14px; line-height:1.65;}
.explain .verdict{font-weight:900; font-size:15px;}
.explain .verdict.ok{color:var(--ok);} .explain .verdict.no{color:var(--no);}
.explain .star{margin-top:10px; font-size:13.5px;}
.explain .star::before{content:"★ "; color:var(--accent);}
.explain .basis{margin-top:8px; font-size:12.5px; color:var(--sub);}
.book{display:flex; gap:10px; align-items:center; margin-top:12px; padding:11px 13px; background:var(--warm); border-radius:10px; font-size:13.5px; line-height:1.45;}
.book .pg{font-family:'Noto Serif KR',serif; font-weight:900; font-size:20px; color:var(--accent); white-space:nowrap;}
.donutbox{text-align:center; padding:6px 0 4px;}
.donut{width:160px; height:160px; margin:0 auto; position:relative;}
.donut svg{transform:rotate(-90deg);}
.donut .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.donut .num b{font-size:36px; font-family:'Noto Serif KR',serif;}
.donut .num span{font-size:12.5px; color:var(--sub);}
.msg{margin-top:10px; font-size:14.5px; line-height:1.55;}
.rv{display:flex; gap:10px; padding:10px 2px; border-top:1px solid var(--line); font-size:13.5px; line-height:1.5;}
.rv .mark{font-weight:900; flex:0 0 18px;} .rv .mark.ok{color:var(--ok);} .rv .mark.no{color:var(--no);}
.rv .p{margin-left:auto; color:var(--accent); font-weight:700; white-space:nowrap; font-size:12.5px;}
.cta{margin-top:18px; padding:18px; border-radius:12px; background:var(--warm); text-align:center;}
.cta b{display:block; font-size:16px; margin-bottom:6px;}
.cta p{font-size:13.5px; line-height:1.6; color:var(--sub);}
footer{margin-top:26px; text-align:center; font-size:12px; color:var(--sub); line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">건축(산업)기사 필기 · 건축법규</div>
  <h1>그림으로 푸는 건축법규</h1>
  <div class="sub">책에 실린 103문항을 그대로 — 바로 채점 · 정답 해설<br>틀린 문제의 <b>그림</b>은 책 쪽번호로 찾아간다</div>
</header>

<div id="scrStart">
  <div class="card">
    <h2>챕터를 골라 풀기</h2>
    <div class="lead">챕터 순서는 법제처 건축법의 장 순서와 같습니다. 문항마다 보기 순서는 매번 섞입니다.</div>
    <div class="grid" id="chGrid"></div>
  </div>
  <div class="card">
    <h2>실전처럼 20문항</h2>
    <div class="lead">103문항 가운데 20문항을 무작위로 뽑습니다. 합격선은 12문항(60점)입니다.</div>
    <button class="btn warm" onclick="startMock()">실전 모의 20문항 시작</button>
  </div>
</div>

<div id="scrQuiz" class="card hidden">
  <div class="progress"><span id="pgLabel"></span><span id="pgScore"></span></div>
  <div class="bar"><div id="pgBar"></div></div>
  <div id="qUnit" class="unit"></div>
  <div id="qText" class="qtext"></div>
  <div id="qOpts"></div>
  <div id="qExplain" class="explain hidden"></div>
  <button id="btnNext" class="btn hidden" onclick="nextQ()">다음 문제</button>
</div>

<div id="scrResult" class="card hidden">
  <div class="donutbox">
    <div class="donut">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="66" fill="none" stroke="var(--tint)" stroke-width="15"/>
        <circle id="donutArc" cx="80" cy="80" r="66" fill="none" stroke="var(--navy)" stroke-width="15" stroke-linecap="round" stroke-dasharray="0 999"/>
      </svg>
      <div class="num"><b id="rScore">0</b><span id="rOf"></span></div>
    </div>
    <div class="msg" id="rMsg"></div>
  </div>
  <div id="rReview" style="margin-top:12px"></div>
  <div class="cta" id="rCta"></div>
  <button class="btn" onclick="toStart()">다른 챕터 풀기</button>
  <button class="btn ghost" onclick="retry()">이 세트 다시 풀기</button>
</div>

<footer>『그림으로 푸는 건축법규』 김찬주 지음 · 유페이퍼<br>법령 기준일 2026. 10. 13. — 일조 정북 이격 3단(2026. 11. 12. 시행) 반영</footer>
</div>

const DATA = [{"c": "01", "u": "초고층건축물", "q": "다음의 초고층 건축물의 정의에 관한 기준 내용 중 ( ) 안에 알맞은 것은?<br><span class=\"qx\">\"초고층건축물\"이란 층수가 ( ① )층 이상이거나 높이가 ( ② )미터 이상인 건축물을 말한다.</span>", "o": ["① 50, ② 150", "① 50, ② 200", "① 60, ② 150", "① 60, ② 200"], "a": 1, "v": "50층 · 200m", "e": "초고층건축물은 <b>층수 50층 이상 또는 높이 200m 이상</b>이다. \"이거나\"이므로 <b>둘 중 하나만 넘어도</b> 초고층이다.", "s": "짝이 되는 숫자를 함께 외운다 — <b>고층건축물은 30층 또는 120m</b>, <b>준초고층건축물은 고층 중 초고층이 아닌 것</b>(= 30~49층대).", "l": "건축법 시행령 제2조 제19호", "r": "5년간 5회 출제 — 제1장 최다 빈출", "p": 12, "f": 13, "g": 1}, {"c": "01", "u": "다중이용건축물", "q": "건축법령상 <b>다중이용건축물</b>에 속하지 <b>않는</b> 것은? (단, 16층 미만으로 해당 용도로 쓰는 바닥면적의 합계가 5,000㎡인 건축물인 경우)", "o": ["종교시설", "판매시설", "의료시설 중 종합병원", "숙박시설 중 일반숙박시설"], "a": 3, "v": "일반숙박시설은 제외", "e": "다중이용건축물의 숙박시설은 <b>관광숙박시설만</b> 해당한다. 일반숙박시설(모텔·여관 등)은 5,000㎡가 넘어도 다중이용건축물이 아니다.", "s": "용도마다 붙은 <b>단서</b>가 전부다 — 문화 및 집회시설은 <b>동·식물원 제외</b>, 운수시설은 <b>여객용만</b>, 의료시설은 <b>종합병원만</b>, 숙박시설은 <b>관광숙박시설만</b>.", "l": "건축법 시행령 제2조 제17호", "r": "같은 유형 5년간 5회 출제", "p": 14, "f": 15, "g": 2}, {"c": "01", "u": "지하층", "q": "다음은 건축법령상 <b>지하층</b>의 정의 내용이다. ( ) 안에 알맞은 것은?<br><span class=\"qx\">\"지하층\"이란 건축물의 바닥이 지표면 아래에 있는 층으로서 바닥에서 지표면까지 평균 높이가 해당 층 높이의 ( ) 이상인 것을 말한다.</span>", "o": ["2분의 1", "3분의 1", "3분의 2", "4분의 3"], "a": 0, "v": "2분의 1", "e": "바닥에서 지표면까지의 <b>평균 높이</b>가 그 층 높이의 <b>2분의 1 이상</b>이면 지하층이다. 층높이 3m라면 <b>1.5m 이상</b>이 땅에 묻혀야 한다.", "s": "두 낱말 — <b>\"평균\"</b>(경사지면 평균)과 <b>\"층 높이\"</b>(건물 높이 아님). 지하층은 용적률·층수에서 뺀다(CH04).", "l": "건축법 제2조 제1항 제5호", "r": "5년간 2회 출제 (용어 종합 문항 포함 4회)", "p": 16, "f": 17, "g": 3}, {"c": "01", "u": "용어의 정의 — 건축", "q": "건축법령상 <b>용어의 정의</b>로 옳지 <b>않은</b> 것은?", "o": ["건축이란 건축물을 신축·증축·개축·재축하거나 건축물을 대수선하는 것을 말한다.", "리모델링이란 건축물의 노후화를 억제하거나 기능 향상 등을 위하여 대수선하거나 일부 증축하는 행위를 말한다.", "거실이란 건축물 안에서 거주, 집무, 작업, 집회, 오락, 그 밖에 이와 유사한 목적을 위하여 사용되는 방을 말한다.", "지하층이란 건축물의 바닥이 지표면 아래에 있는 층으로서 바닥에서 지표면까지 평균 높이가 해당 층 높이의 2분의 1 이상인 것을 말한다."], "a": 0, "v": "\"대수선\"이 아니라 \"이전\"", "e": "\"건축\"은 <b>신축·증축·개축·재축하거나 건축물을 이전하는 것</b>이다. <b>대수선은 건축에 포함되지 않는</b> 별개의 행위다.", "s": "\"건축\" 다섯은 <b>신축 · 증축 · 개축 · 재축 · 이전</b>이다. 보기에 <b>대수선</b>이 끼어 있으면 그것이 틀린 보기다.", "l": "건축법 제2조 제1항", "r": "용어 종합 문항 5년간 4회 출제", "p": 18, "f": 19, "g": 4}, {"c": "01", "u": "건축설비와 주요구조부", "q": "다음 중 건축법에서 정의하는 <b>건축설비</b>가 <b>아닌</b> 것은?", "o": ["배연설비", "승강기", "주계단", "피뢰침"], "a": 2, "v": "주계단", "e": "<b>주계단</b>은 <b>주요구조부</b>에 해당하고 건축설비가 아니다. 건축설비에는 굴뚝·승강기·피뢰침처럼 구조와 무관해 보이는 것도 들어간다.", "s": "<b>주요구조부는 여섯</b> — 내력벽·기둥·바닥·보·지붕틀·<b>주계단</b>. 제외되는 다섯도 함께 외운다 — <b>사이기둥·최하층 바닥·작은 보·차양·옥외계단</b>.", "l": "건축법 제2조 제1항 제4호·제7호", "r": "같은 유형 5년간 2회 출제", "p": 20, "f": 21, "g": 5}, {"c": "01", "u": "건축재료", "q": "다음 중 건축법에 <b>규정되어 있지 않은</b> 용어의 정의는?", "o": ["부속용도", "방수재료", "부속건축물", "내수재료"], "a": 1, "v": "방수재료", "e": "건축법령이 정의하는 재료는 <b>불연재료 · 준불연재료 · 난연재료 · 내수재료</b> 넷이다. <b>\"방수재료\"라는 정의는 없다.</b>", "s": "불에 대한 세 등급은 <b>불연 → 준불연 → 난연</b> 순으로 약해진다. <b>내수재료만 불이 아니라 물</b>에 대한 것이라는 점이 함정이다.", "l": "건축법 시행령 제2조", "r": "같은 유형 5년간 2회 출제", "p": 22, "f": 23, "g": 6}, {"c": "01", "u": "발코니", "q": "건축법령상 다음과 같이 정의되는 용어는?<br><span class=\"qx\">건축물의 내부와 외부를 연결하는 완충공간으로서 전망이나 휴식 등의 목적으로 건축물 외벽에 접하여 부가적(附加的)으로 설치되는 공간</span>", "o": ["테라스", "발코니", "베란다", "부속용도"], "a": 1, "v": "발코니", "e": "<b>발코니</b>의 정의 그대로다. 테라스와 베란다는 건축법령에 정의가 없는 관용어다.", "s": "셋 중 <b>법에 정의된 것은 발코니뿐</b>이다. 발코니는 면적 산정에서도 나온다 — 노대 등의 면적에서 <b>가장 긴 외벽 길이 × 1.5m</b>를 뺀 나머지만 바닥면적에 넣는다(CH04).", "l": "건축법 시행령 제2조 제14호", "r": "같은 유형 5년간 2회 출제", "p": 24, "f": 25, "g": 7}, {"c": "02", "u": "주택의 분류", "q": "주택으로 쓰는 1개 동의 바닥면적 합계가 600㎡이고, 주택으로 쓰는 층수가 4개 층인 주택의 용도는?", "o": ["다가구주택", "다세대주택", "연립주택", "다중주택"], "a": 1, "v": "다세대주택", "e": "660㎡ <b>이하</b> ∩ <b>4개 층</b> 이하 → <b>다세대주택</b>이고, 이는 <b>공동주택</b>이다. 면적이 같아도 층수 하나가 단독주택과 공동주택을 가른다.", "s": "660㎡ 이하에서 3개 층이면 단독(다가구), 4개 층이면 공동(다세대). 층수 하나로 법규가 통째로 바뀐다.", "l": "건축법 시행령 별표 1 제1호 다목 · 제2호 다목", "r": "", "p": 28, "f": 29, "g": 1}, {"c": "02", "u": "다중주택과 다가구주택", "q": "다중주택과 다가구주택을 구분하는 기준으로 옳은 것은?", "o": ["각 실별 취사시설의 설치 여부", "주택으로 쓰는 바닥면적의 합계", "주택으로 쓰는 층수", "부설주차장의 면적"], "a": 0, "v": "취사시설 설치 여부", "e": "두 주택은 <b>660㎡ 이하 ∩ 3개 층 이하</b>로 면적·층수가 <b>완전히 같다.</b> 다중주택은 <b>독립된 주거 형태가 아니어서</b> 각 실에 취사시설을 두지 않고(욕실은 설치 가능), 다가구주택은 독립된 주거 형태에 <b>19세대 이하</b>다.", "s": "면적과 층수가 같아졌으므로, 이제 다중주택과 다가구주택을 가르는 것은 취사시설과 19세대뿐이다.", "l": "건축법 시행령 별표 1 제1호 나목 · 다목", "r": "⚠ 개정안 입법예고 중 — 다가구·다세대 1,000㎡ 미만 · 다가구 4개 층 (다중주택은 대상 아님)", "p": 30, "f": 31, "g": 2}, {"c": "02", "u": "기숙사", "q": "공동주택 중 기숙사에 해당하기 위한 요건으로 옳은 것은?", "o": ["주택으로 쓰는 층수가 5개 층 이상일 것", "1개 동의 공동취사시설 이용 세대 수가 전체의 50퍼센트 이상일 것", "1개 동의 바닥면적 합계가 660㎡를 초과할 것", "공동취사시설 이용 세대 수가 전체의 30퍼센트 이상일 것"], "a": 1, "v": "공동취사시설 이용 세대 50% 이상", "e": "기숙사는 학교 또는 공장 등의 학생·종업원 등을 위해 쓰는 것으로서, <b>1개 동의 공동취사시설 이용 세대 수가 전체의 50% 이상</b>인 것이다. 기숙사만 <b>면적·층수 기준이 없다.</b>", "s": "공동주택 4종 중 아파트·연립·다세대는 면적과 층수로, 기숙사만 취사시설 비율로 갈린다.", "l": "건축법 시행령 별표 1 제2호 라목", "r": "", "p": 32, "f": 33, "g": 3}, {"c": "02", "u": "제1종 근린생활시설", "q": "식품·잡화·의류·완구 등 일용품을 판매하는 소매점이 제1종 근린생활시설이 되기 위한 바닥면적 기준은?", "o": ["같은 건축물 안 해당 용도 바닥면적 합계 300㎡ 미만", "같은 건축물 안 해당 용도 바닥면적 합계 500㎡ 미만", "같은 건축물 안 해당 용도 바닥면적 합계 1,000㎡ 미만", "같은 건축물 안 해당 용도 바닥면적 합계 2,000㎡ 미만"], "a": 2, "v": "1,000㎡ 미만", "e": "일용품을 판매하는 <b>소매점</b>은 같은 건축물 안에서 해당 용도로 쓰는 바닥면적 합계가 <b>1,000㎡ 미만</b>일 때 제1종 근린생활시설이다. 1,000㎡ 이상이면 <b>판매시설</b>이 된다.", "s": "근생의 숫자는 300(휴게음식점) · 500(학원·공연장) · 1,000(소매점) 세 개다. 어느 용도의 숫자인지가 핵심.", "l": "건축법 시행령 별표 1 제3호 가목", "r": "", "p": 34, "f": 35, "g": 4}, {"c": "02", "u": "제2종 근린생활시설", "q": "바닥면적의 합계가 400㎡인 학원(자동차학원·무도학원 제외)의 건축법령상 용도는?", "o": ["제1종 근린생활시설", "교육연구시설", "제2종 근린생활시설", "업무시설"], "a": 2, "v": "제2종 근린생활시설", "e": "학원·교습소·직업훈련소는 바닥면적 합계 <b>500㎡ 미만</b>이면 제2종 근린생활시설, <b>500㎡ 이상</b>이면 교육연구시설이다. 400㎡는 500㎡ 미달이므로 2종 근생.", "s": "자동차학원과 무도학원은 면적과 무관하게 각각 자동차 관련 시설·위락시설이다. 괄호를 반드시 읽어야 한다.", "l": "건축법 시행령 별표 1 제4호 · 제10호", "r": "", "p": 36, "f": 37, "g": 5}, {"c": "02", "u": "판매시설", "q": "같은 건축물 안에서 일용품을 판매하는 소매점의 바닥면적 합계가 1,200㎡인 경우, 이 부분의 건축법령상 용도는?", "o": ["판매시설", "제1종 근린생활시설", "제2종 근린생활시설", "창고시설"], "a": 0, "v": "판매시설", "e": "소매점은 1,000㎡ 미만일 때만 제1종 근린생활시설이다. <b>1,200㎡는 1,000㎡ 이상</b>이므로 <b>판매시설</b>이 된다. 판매시설은 도매시장·소매시장과 이 상점을 포함한다.", "s": "용도는 면적이 커지면 계단처럼 올라간다 — 소매점은 근생(1종) → 판매시설로 한 칸만 오른다.", "l": "건축법 시행령 별표 1 제7호", "r": "제3호 가목과 짝으로 출제", "p": 38, "f": 39, "g": 6}, {"c": "02", "u": "헷갈리는 용도", "q": "건축물과 건축법령상 용도의 연결이 옳지 않은 것은?", "o": ["식물원 — 동물 및 식물 관련 시설", "도축장 — 동물 및 식물 관련 시설", "야영장 시설 — 수련시설", "장례식장 — 장례시설"], "a": 0, "v": "식물원 — 동물 및 식물 관련 시설", "e": "<b>동물원·식물원·수족관은 「문화 및 집회시설」</b>이다. 사람이 보러 가는 시설이기 때문이다. 「동물 및 식물 관련 시설」은 축사·도축장·작물재배사·온실처럼 <b>생산·처리</b>를 위한 시설이다.", "s": "“보러 가는가, 기르고 처리하는가” — 동물원·식물원은 전자라 문화 및 집회시설이다.", "l": "건축법 시행령 별표 1 제5호 · 제21호", "r": "", "p": 40, "f": 41, "g": 7}, {"c": "02", "u": "의료시설과 근린생활시설", "q": "다음 중 건축법령상 제2종 근린생활시설에 해당하는 것은?", "o": ["치과의원", "동물병원", "한방병원", "조산원"], "a": 1, "v": "동물병원", "e": "사람을 진료하는 <b>‘원’</b>급(의원·치과의원·한의원·침술원·접골원·조산원)은 <b>제1종 근린생활시설</b>, <b>‘병원’</b>급(종합병원·병원·치과병원·한방병원·요양병원 등)은 <b>의료시설</b>이다. <b>동물병원</b>만 이름에 ‘병원’이 붙지만 사람을 진료하지 않으므로 <b>제2종 근린생활시설</b>이다.", "s": "‘원’이면 1종 근생, ‘병원’이면 의료시설, 동물이면 2종 근생 — 이름의 끝 글자와 대상이 가른다.", "l": "건축법 시행령 별표 1 제3호 라목 · 제4호 · 제9호", "r": "", "p": 42, "f": 43, "g": 8}, {"c": "03", "u": "건축행위 5종", "q": "다음은 건축법령상 용어의 정의이다. ( ) 안에 알맞은 것은?<br>「( )이란 기존 건축물의 전부 또는 일부(내력벽·기둥·보·지붕틀 중 셋 이상이 포함되는 경우를 말한다)를 해체하고 그 대지에 종전과 같은 규모의 범위에서 건축물을 다시 축조하는 것을 말한다」", "o": ["신축", "증축", "개축", "재축"], "a": 2, "v": "개축", "e": "스스로 헐고 <b>같은 규모의 범위에서</b> 다시 짓는 것이 <b>개축</b>이다. 해체 대상이 내력벽·기둥·보·지붕틀 <b>중 셋 이상의 종류</b>를 포함해야 한다.", "s": "개축과 재축은 결과물이 같아 보이지만 <b>왜 없어졌는가</b>가 다르다 — <b>내가 헐었으면 개축, 재해로 멸실되었으면 재축</b>.", "l": "건축법 시행령 제2조", "r": "총칙 최다 빈출 — 5종 정의 연결은 거의 매 회차 출제", "p": 46, "f": 47, "g": 1}, {"c": "03", "u": "재축의 요건", "q": "건축법령상 <b>재축</b>에 해당하기 위한 요건으로 옳지 <b>않은</b> 것은?", "o": ["천재지변이나 그 밖의 재해로 멸실된 경우일 것", "연면적 합계는 종전 규모 이하일 것", "동수·층수 및 높이가 모두 종전 규모 이하일 것", "연면적 합계가 종전 규모를 초과하는 경우에는 건축위원회의 심의를 거칠 것"], "a": 3, "v": "연면적은 초과할 수 없다", "e": "동수·층수·높이는 <b>하나가 종전을 넘더라도</b> 그 동수·층수 및 높이가 건축법령등에 모두 적합하면 재축으로 본다. 그러나 <b>연면적 합계는 예외 없이 종전 규모 이하</b>여야 한다. 심의로 넘길 수 있는 조항이 없다.", "s": "네 가지를 견준다 — <b>연면적 · 동수 · 층수 · 높이</b>. 예외가 붙는 것은 뒤의 셋뿐이고 <b>연면적은 언제나 이하</b>다.", "l": "건축법 시행령 제2조 제4호", "r": "‘연면적만 예외가 없다’가 출제 포인트", "p": 48, "f": 49, "g": 2}, {"c": "03", "u": "증축", "q": "건축법령상 <b>증축</b>에 해당하는 것은?", "o": ["주된 건축물이 있는 대지에 창고를 새로 축조하는 것", "건축물이 없는 대지에 건축물을 새로 축조하는 것", "주요구조부를 해체하지 아니하고 같은 대지의 다른 위치로 옮기는 것", "재해로 멸실된 건축물을 종전 규모 이하로 다시 축조하는 것"], "a": 0, "v": "부속건축물을 새로 짓는 것", "e": "주된 건축물이 <b>이미 있는</b> 대지에 창고·차고 같은 부속건축물을 짓는 것은 <b>건축면적과 연면적이 늘어나므로 증축</b>이다. ‘새로 짓는다’는 말에 이끌려 신축으로 고르기 쉽다.", "s": "방향이 반대인 두 문장을 붙여 외운다 — <b>부속건축물만 있는 대지에 주된 건축물 = 신축</b>, <b>주된 건축물이 있는 대지에 부속건축물 = 증축</b>.", "l": "건축법 시행령 제2조 제2호", "r": "부속건축물 관련 함정이 반복 출제", "p": 50, "f": 51, "g": 3}, {"c": "03", "u": "대수선 ①", "q": "건축법령상 <b>대수선</b>의 범위에 해당하지 <b>않는</b> 것은?", "o": ["내력벽의 벽면적을 20제곱미터 수선하는 것", "기둥을 세 개 수선하는 것", "보를 증설하는 것", "주계단을 해체하는 것"], "a": 0, "v": "내력벽 20㎡ 수선", "e": "내력벽을 <b>수선 또는 변경</b>할 때는 <b>벽면적 30㎡ 이상</b>이어야 대수선이다. 20㎡는 기준에 못 미친다. (같은 내력벽이라도 <b>증설하거나 해체</b>하면 면적과 무관하게 대수선이다.)", "s": "수량이 붙는 곳은 다섯뿐이다 — 내력벽 <b>30㎡</b>, 기둥·보·지붕틀 <b>세 개</b>, 외벽 마감재료 <b>30㎡</b>. 그것도 <b>수선·변경</b>에만 붙는다.", "l": "건축법 시행령 제3조의2", "r": "[17·23산] 등 반복 출제", "p": 52, "f": 53, "g": 4}, {"c": "03", "u": "대수선 ②", "q": "건축법령상 대수선에 관한 설명으로 옳지 <b>않은</b> 것은?", "o": ["내력벽을 증설하거나 해체하는 것은 벽면적과 관계없이 대수선이다", "기둥을 두 개 해체하는 것은 대수선에 해당하지 않는다", "다가구주택의 가구 간 경계벽을 수선하는 것은 대수선이다", "건축물의 외벽에 사용하는 마감재료를 벽면적 30제곱미터 이상 변경하는 것은 대수선이다"], "a": 1, "v": "두 개를 해체해도 대수선이다", "e": "조문은 「기둥을 <b>증설 또는 해체</b>하거나 <b>세 개 이상 수선 또는 변경</b>하는 것」으로 읽는다. ‘세 개 이상’은 <b>수선·변경에만</b> 걸리는 수식어이므로, <b>해체는 개수와 무관하게</b> 대수선이다.", "s": "조문을 끊어 읽는 법 — <b>[증설 또는 해체]하거나 [세 개 이상 수선 또는 변경]</b>. 앞뒤가 별개의 요건이다.", "l": "건축법 시행령 제3조의2", "r": "‘증설·해체’와 ‘수선·변경’의 구분이 함정", "p": 54, "f": 55, "g": 5}, {"c": "03", "u": "리모델링", "q": "건축법령상 <b>리모델링</b>에 관한 설명으로 옳지 <b>않은</b> 것은?", "o": ["건축물의 노후화를 억제하거나 기능 향상 등을 위한 행위이다", "대수선하거나 건축물의 일부를 증축 또는 개축하는 행위를 말한다", "리모델링이 쉬운 구조의 공동주택은 용적률, 건축물의 높이 제한, 일조 등의 확보를 위한 높이 제한을 완화받을 수 있다", "완화하여 적용할 수 있는 비율은 100분의 150의 범위이다"], "a": 3, "v": "100분의 120의 범위", "e": "리모델링이 쉬운 구조의 공동주택을 허가할 때 완화할 수 있는 범위는 <b>100분의 120</b>이다. 150이 아니다.", "s": "리모델링은 새 행위가 아니라 <b>목적이 붙은 묶음</b>이다 — 대수선 + 일부 증축 + 일부 개축.", "l": "건축법 제2조 · 제8조 · 시행령 제6조의5", "r": "120%라는 숫자가 반복 출제", "p": 56, "f": 57, "g": 6}, {"c": "03", "u": "건축허가와 신고", "q": "건축법령상 미리 신고를 하면 건축허가를 받은 것으로 보는 <b>건축신고 대상</b>에 해당하지 <b>않는</b> 것은? (단, 도시지역이며 지구단위계획구역이 아님)", "o": ["바닥면적의 합계가 85제곱미터인 단층 건축물의 증축", "연면적이 150제곱미터이고 2층인 건축물의 대수선", "연면적이 150제곱미터이고 2층인 건축물의 신축", "주요구조부의 해체가 없는 대수선"], "a": 2, "v": "도시지역에서의 신축", "e": "연면적 200㎡ 미만·3층 미만 건축물의 <b>건축(신축 포함)</b>이 신고 대상이 되는 것은 <b>관리지역·농림지역·자연환경보전지역</b>에 한한다. 도시지역이면 규모가 작아도 <b>허가</b> 대상이다.", "s": "같은 ‘200㎡ 미만 · 3층 미만’이라도 <b>대수선은 어디서나 신고, 신축은 관리·농림·자연환경보전지역에서만 신고</b>다.", "l": "건축법 제14조 · 시행령 제11조", "r": "85 / 200 / 3층 / 1/10 네 숫자", "p": 58, "f": 59, "g": 7}, {"c": "04", "u": "건폐율", "q": "건폐율의 최대한도가 60%인 지역에 대지면적 500㎡의 대지가 있다. 건축할 수 있는 최대 건축면적은?", "o": ["200㎡", "300㎡", "500㎡", "833㎡"], "a": 1, "v": "300㎡", "e": "최대 건축면적 = <b>대지면적 × 건폐율</b> = 500 × 0.6 = <b>300㎡</b>. 건폐율은 위에서 내려다본 그림자의 비율이므로 <b>층수와 무관</b>하다.", "s": "건폐율 한도가 주어지면 곱셈, 건축면적이 주어지면 나눗셈. 묻는 방향을 먼저 확인한다.", "l": "건축법 제55조 · 국토계획법 제77조", "r": "계산 유형 · 건폐율 한도 4회 출제 (2022-1회 91번 · 2024-3회 93번 외)", "p": 62, "f": 63, "g": 1}, {"c": "04", "u": "용적률", "q": "대지면적 300㎡, 지상 1층 필로티 주차장 100㎡, 2층 150㎡, 3층 150㎡, 지하층 100㎡인 건축물의 용적률은?", "o": ["100%", "133%", "166%", "200%"], "a": 0, "v": "100%", "e": "용적률 산정용 연면적에서는 <b>지하층</b>과 <b>지상층의 부속용도 주차용 면적</b>을 <b>모두</b> 뺀다. (150 + 150) / 300 × 100 = <b>100%</b>.", "s": "용적률 문제에 ‘필로티 주차장’이 보이면 지하층과 함께 두 번 뺀다. 지하층만 빼면 함정에 걸린다.", "l": "건축법 제56조 · 시행령 제119조 ①항 4호", "r": "2021-3회 87번 (계산) · 2022-2회 86번 (연면적)", "p": 64, "f": 65, "g": 2}, {"c": "04", "u": "건축면적 — 처마", "q": "평면이 12m×8m인 한옥에 처마가 사방으로 2.5m씩 돌출되어 있다. 이 건축물의 건축면적은?", "o": ["96㎡", "117㎡", "153㎡", "187㎡"], "a": 1, "v": "117㎡", "e": "<b>한옥</b>은 처마 끝에서 <b>2m</b> 후퇴한 선까지 산입한다(일반 건축물은 1m). 사방 (2.5−2)=0.5m씩 확장 → 13 × 9 = <b>117㎡</b>.", "s": "후퇴 거리는 건물 종류가 정한다 — 일반 1m · 한옥 2m · 축사 돌출차양 3m · 전통사찰 4m.", "l": "건축법 시행령 제119조 ①항 2호", "r": "계산 유형 · 산정 기본 원칙 [15·23·24산]", "p": 66, "f": 67, "g": 3}, {"c": "04", "u": "바닥면적 — 노대", "q": "주택의 발코니 면적이 15㎡이고, 이 발코니가 접한 외벽의 길이가 각각 5m와 3m이다. 바닥면적에 산입되는 면적은?", "o": ["0㎡", "3㎡", "7.5㎡", "15㎡"], "a": 2, "v": "7.5㎡", "e": "공제액은 <b>가장 긴 외벽</b>에 접한 길이 하나만 쓴다. 5 × 1.5 = 7.5㎡를 빼고 15 − 7.5 = <b>7.5㎡</b>가 산입된다.", "s": "여러 벽에 접할수록 유리해지는 것을 막기 위해, 조문이 ‘가장 긴 한 변’으로 한정했다.", "l": "건축법 시행령 제119조 ①항 3호 나목", "r": "2020-1·2회 100번 · 2023-2회 95번 (바닥면적 산정)", "p": 68, "f": 69, "g": 4}, {"c": "04", "u": "용어의 정의", "q": "건축법령상 높이 관련 용어의 정의로 옳지 않은 것은?", "o": ["건축물의 높이는 지표면으로부터 건축물의 상단까지의 높이로 한다", "처마높이는 지표면으로부터 처마 끝부분까지의 높이로 한다", "반자높이는 방의 바닥면으로부터 반자까지의 높이로 한다", "층고는 방의 바닥구조체 윗면으로부터 위층 바닥구조체의 윗면까지의 높이로 한다"], "a": 1, "v": "②번 지문", "e": "<b>처마높이</b>는 지표면으로부터 <b>지붕틀 또는 이와 비슷한 수평재를 지지하는 벽·깔도리 또는 기둥의 상단</b>까지의 높이다. ‘처마 끝부분’이 아니다.", "s": "네 가지 높이는 ‘시작점과 끝점’만 다르다. 지표면에서 시작하는 둘과 방에서 시작하는 둘로 나눠 외운다.", "l": "건축법 시행령 제119조 ①항 5호~8호", "r": "2024-2회 86번 · 핵심기출 [07·23산]", "p": 70, "f": 71, "g": 5}, {"c": "04", "u": "건축물의 높이 — 옥탑", "q": "건축면적이 400㎡인 건축물의 옥상에 수평투영면적 60㎡, 높이 15m의 옥탑이 있다. 본체 높이가 20m일 때 이 건축물의 높이는?", "o": ["20m", "23m", "32m", "35m"], "a": 3, "v": "35m", "e": "60 / 400 = <b>15%</b>로 건축면적의 <b>1/8(12.5%)을 초과</b>한다. 따라서 12m 공제를 받지 못하고 <b>옥탑 전체가 산입</b>된다. 20 + 15 = <b>35m</b>.", "s": "순서가 중요하다 — ① 1/8 이하인지 먼저 재고 ② 이하일 때만 12m를 뺀다. 면적 조건을 안 읽으면 틀린다.", "l": "건축법 시행령 제119조 ①항 5호 다목", "r": "2022-2회 91번 (건축면적 400㎡ · 옥탑)", "p": 72, "f": 73, "g": 6}, {"c": "04", "u": "층수", "q": "하나의 건축물에서 부분에 따라 층수가 다르다. A부분 5개 층, B부분 3개 층, C부분 7개 층일 때 이 건축물의 층수는?", "o": ["3개 층", "5개 층", "7개 층", "바닥면적에 따라 가중평균한 층수"], "a": 2, "v": "7개 층", "e": "건축물의 부분에 따라 층수가 다른 경우에는 <b>그 중 가장 많은 층수</b>를 그 건축물의 층수로 본다. 평균이 아니다.", "s": "가중평균은 반자높이·층고의 것이고, 층수는 가장 많은 쪽이다. 두 규칙을 섞지 않는다.", "l": "건축법 시행령 제119조 ①항 9호", "r": "2022 기사 1회 10번", "p": 74, "f": 75, "g": 7}, {"c": "04", "u": "지하층", "q": "지하 2층, 지상 5층인 건축물이 있다. 지하층에 관한 설명으로 옳지 않은 것은?", "o": ["지하층은 건축물의 층수에 산입하지 아니한다", "지하층의 바닥면적은 연면적에 포함된다", "지하층의 바닥면적은 용적률 산정용 연면적에서 제외된다", "이 건축물의 층수는 7개 층이다"], "a": 3, "v": "④번 지문", "e": "지하층은 <b>층수에 산입하지 않으므로</b> 이 건축물의 층수는 <b>5개 층</b>이다. 지하 2층을 더해 7개 층으로 세면 안 된다.", "s": "지하층은 연면적에는 넣고, 용적률과 층수에서는 뺀다. 같은 ‘연면적’이라는 말이 두 뜻으로 쓰인다.", "l": "건축법 제2조 ①항 5호 · 시행령 제119조 ①항 4호·9호", "r": "2022-1회 98번 · 2022-2회 86번 · [09산]", "p": 76, "f": 77, "g": 8}, {"c": "04", "u": "반자높이", "q": "문화 및 집회시설 중 집회장의 용도에 쓰이는 거실로서 바닥면적이 200㎡ 이상인 경우, 반자높이의 최저기준은? (기계환기장치를 설치하지 않은 경우)", "o": ["2.1m 이상", "2.7m 이상", "4m 이상", "4.5m 이상"], "a": 2, "v": "4m 이상", "e": "거실의 반자높이는 <b>2.1m 이상</b>이 원칙이지만, 문화 및 집회시설·종교시설·장례시설·유흥주점의 거실로서 <b>바닥면적 200㎡ 이상</b>인 것은 <b>4m 이상</b>이어야 한다.", "s": "2.1 — 2.7 — 4.0 세 숫자가 한 조문에 같이 있다. 어느 공간의 숫자인지로 구분한다.", "l": "건축법 시행령 제50조 · 피난방화규칙 제16조", "r": "2022-1회 95번 · 2023-1회 95번 · [19산] — 3회", "p": 78, "f": 79, "g": 9}, {"c": "04", "u": "지표면 산정", "q": "대지의 지표면에 고저차가 있는 경우, 건축물의 높이를 산정하기 위한 지표면의 기준으로 옳은 것은?", "o": ["가장 낮은 지점을 지표면으로 본다", "가장 높은 지점을 지표면으로 본다", "건축물 주위가 접하는 각 지표면 부분 높이를 평균한 수평면을 지표면으로 본다", "전면도로의 중심선을 지표면으로 본다"], "a": 2, "v": "평균한 수평면", "e": "건축물의 대지에 고저차가 있는 경우에는 건축물의 <b>주위가 접하는 각 지표면 부분의 높이를 평균한 수평면</b>을 지표면으로 본다. 고저차가 <b>3m를 넘는 경우</b>에는 그 <b>3m마다 구분</b>하여 각각의 평균을 구한다.", "s": "대지 <b>안</b>의 고저차는 평균, 대지와 <b>도로</b> 사이의 고저차는 절반. 안에서는 평균, 밖과는 나눠 갖는다.", "l": "건축법 시행령 제119조 ②항", "r": "핵심기출 [04산] · 2024-2회 86번", "p": 80, "f": 81, "g": 10}, {"c": "05", "u": "건축신고 대상", "q": "건축허가 대상 건축물이라 하더라도 국토교통부령으로 정하는 바에 따라 <b>신고</b>를 하면 건축허가를 받은 것으로 보는 경우에 해당하지 <b>않는</b> 것은?", "o": ["바닥면적의 합계 50㎡의 증축", "바닥면적의 합계 80㎡의 재축", "바닥면적의 합계 60㎡의 개축", "연면적 200㎡이고 층수가 3층인 건축물의 대수선"], "a": 3, "v": "연면적 200㎡ · 3층 대수선", "e": "증축·개축·재축은 바닥면적 합계 <b>85㎡ 이내</b>면 신고 대상이다. 대수선은 <b>연면적 200㎡ 미만</b>이고 <b>3층 미만</b>이어야 하는데, 200㎡이고 3층이면 <b>둘 다 \"미만\"이 아니므로</b> 허가 대상이다.", "s": "함정은 언제나 대수선이다 — <b>85㎡는 \"이내\", 대수선은 200㎡·3층 \"미만\"이고 둘 다 만족해야 한다.</b>", "l": "건축법 제14조 제1항", "r": "같은 유형 5년간 7회 — 제2장 최다 빈출", "p": 84, "f": 85, "g": 1}, {"c": "05", "u": "건축기준의 허용오차", "q": "건축물의 건축에 있어 <b>건축물 관련 건축기준의 허용오차</b> 범위로 옳지 <b>않은</b> 것은?", "o": ["출구너비 : 3% 이내", "반자높이 : 2% 이내", "벽체두께 : 3% 이내", "바닥판두께 : 3% 이내"], "a": 0, "v": "출구너비는 2% 이내", "e": "건축물 관련 항목에서 <b>3%</b>가 허용되는 것은 <b>벽체두께와 바닥판두께</b>, 즉 \"두께\" 둘뿐이다. 높이·평면길이·출구너비·반자높이는 모두 <b>2% 이내</b>다.", "s": "<b>두께만 3%, 나머지는 2%</b> — 이 한 줄이면 건축물 관련 여섯 항목이 다 풀린다.", "l": "건축법 제26조 · 시행규칙 별표 5", "r": "같은 유형 5년간 6회", "p": 86, "f": 87, "g": 2}, {"c": "05", "u": "용도변경", "q": "다음 중 <b>허가</b> 대상에 해당하는 용도변경은?", "o": ["교육 및 복지시설군 → 영업시설군", "영업시설군 → 주거업무시설군", "전기통신시설군 → 문화 및 집회시설군", "문화 및 집회시설군 → 교육 및 복지시설군"], "a": 0, "v": "교육및복지(6) → 영업(5)", "e": "시설군은 1번(자동차)부터 9번(그 밖)까지 아홉 단이다. <b>번호가 작아지는 방향</b>(상위군)으로 바꾸면 <b>허가</b>, <b>커지는 방향</b>(하위군)으로 바꾸면 <b>신고</b>다. 교육 및 복지(6) → 영업(5)는 번호가 작아지므로 허가 대상이다.", "s": "순서만 외우면 된다 — <b>자동차·산업·전기통신·문화집회·영업·교육복지·근생·주거업무·그 밖.</b>", "l": "건축법 제19조 · 시행령 제14조", "r": "같은 유형 5년간 4회", "p": 88, "f": 89, "g": 3}, {"c": "05", "u": "허가권자", "q": "건축물을 <b>특별시나 광역시</b>에 건축하려는 경우 특별시장이나 광역시장의 허가를 받아야 하는 대상 건축물의 규모 기준은?", "o": ["층수가 21층 이상이거나 연면적의 합계가 100,000㎡ 이상인 건축물", "층수가 21층 이상이거나 연면적의 합계가 300,000㎡ 이상인 건축물", "층수가 41층 이상이거나 연면적의 합계가 100,000㎡ 이상인 건축물", "층수가 41층 이상이거나 연면적의 합계가 300,000㎡ 이상인 건축물"], "a": 0, "v": "21층 이상 또는 10만㎡ 이상", "e": "건축허가권자는 원칙적으로 <b>특별자치시장·특별자치도지사 또는 시장·군수·구청장</b>이다. 다만 특별시·광역시에 <b>21층 이상이거나 연면적의 합계가 10만㎡ 이상</b>인 건축물을 건축하려면 <b>특별시장이나 광역시장</b>의 허가를 받아야 한다.", "s": "숫자는 <b>21층과 10만㎡</b> 둘뿐이다. 도지사 사전승인 기준도 같은 숫자다.", "l": "건축법 제11조 · 시행령 제8조", "r": "같은 유형 5년간 2회", "p": 90, "f": 91, "g": 4}, {"c": "05", "u": "리모델링이 쉬운 구조", "q": "공동주택의 건축허가 신청 시 건축물의 용적률·높이 제한 기준을 완화하여 적용받을 수 있는 <b>리모델링이 쉬운 구조</b>에 해당하지 <b>않는</b> 것은?", "o": ["개별 세대 안에서 구획된 실(室)의 크기를 변경할 수 없을 것", "구조체에서 건축설비, 내부 마감재료 및 외부 마감재료를 분리할 수 있을 것", "각 세대는 인접한 세대와 수직 방향으로 통합하거나 분할할 수 있을 것", "각 세대는 인접한 세대와 수평 방향으로 통합하거나 분할할 수 있을 것"], "a": 0, "v": "\"변경할 수 없을 것\"이 아니라 \"있을 것\"", "e": "리모델링이 쉬운 구조의 세 요건은 모두 <b>\"~할 수 있을 것\"</b>으로 끝난다. 개별 세대 안에서 구획된 실의 <b>크기·개수·위치를 변경할 수 있어야</b> 한다.", "s": "보기 넷 중 <b>\"~할 수 없을 것\"</b>이 답이다. 이 조문은 전부 \"할 수 있을 것\"이다.", "l": "건축법 제8조 · 시행령 제6조의5", "r": "같은 유형 5년간 5회", "p": 92, "f": 93, "g": 5}, {"c": "05", "u": "공작물 축조 신고", "q": "건축물과 분리하여 <b>공작물을 축조</b>할 때 특별자치시장·특별자치도지사 또는 시장·군수·구청장에게 <b>신고</b>를 하여야 하는 대상 공작물에 속하는 것은?", "o": ["높이가 7m인 굴뚝", "높이가 7m인 고가수조", "높이가 1m인 옹벽", "높이가 1m인 담장"], "a": 0, "v": "7m 굴뚝", "e": "굴뚝은 <b>6m를 넘는 것</b>이 신고 대상이므로 7m 굴뚝은 해당한다. 고가수조는 <b>8m 초과</b>, 옹벽·담장은 <b>2m 초과</b>라야 한다.", "s": "사다리로 외운다 — <b>2(옹벽·담장) · 4(장식탑·광고탑) · 5(태양광) · 6(굴뚝) · 8(고가수조)</b>.", "l": "건축법 제83조 · 시행령 제118조 제1항", "r": "같은 유형 5년간 2회", "p": 94, "f": 95, "g": 6}, {"c": "05", "u": "설계도서 — 배치도", "q": "건축허가신청에 필요한 설계도서 중 <b>배치도</b>에 표시하여야 할 사항에 해당하지 <b>않는</b> 것은?", "o": ["축척 및 방위", "승강기의 위치", "대지의 종·횡단면도", "주차동선 및 옥외주차계획"], "a": 1, "v": "승강기의 위치", "e": "<b>승강기의 위치</b>는 <b>평면도</b>의 표시사항이다. 배치도는 대지를 위에서 내려다본 그림이므로, 건물 내부에 있는 것은 들어가지 않는다.", "s": "판정 기준은 하나 — <b>대지를 위에서 본 그림에 그릴 수 있는가.</b> 규모·면적은 건축계획서다.", "l": "건축법 시행규칙 제6조 · 별표 2", "r": "같은 유형 5년간 6회", "p": 96, "f": 97, "g": 7}, {"c": "06", "u": "건축지도원", "q": "<b>건축지도원</b>에 관한 내용으로 <b>틀린</b> 것은?", "o": ["건축지도원은 특별자치시·특별자치도 또는 시·군·구에 근무하는 건축직렬의 공무원과 건축에 관한 학식이 풍부한 자 중에서 지정한다.", "건축지도원의 자격과 업무 범위는 건축조례로 정한다.", "건축설비가 법령 등에 적합하게 유지·관리되고 있는지 확인·지도 및 단속한다.", "허가를 받지 아니하거나 신고를 하지 아니하고 건축하거나 용도변경한 건축물을 단속한다."], "a": 1, "v": "업무 범위는 대통령령이 정한다", "e": "건축지도원의 <b>업무 범위는 대통령령(시행령 제24조 제2항)</b>이 정한다. 건축조례가 정하는 것은 <b>자격</b>과 <b>지정 절차·보수 기준</b>이다. 따라서 \"자격과 업무 범위를 건축조례로 정한다\"는 틀렸다.", "s": "업무는 셋뿐이다 — <b>① 신고 건축물의 시공 지도 ② 유지·관리 확인 ③ 무허가·무신고 단속</b>. <b>허가 건축물의 공사관리 지도는 감리자의 일</b>이라는 것이 짝 문항이다.", "l": "건축법 제37조 · 시행령 제24조", "r": "같은 유형 5년간 4회 출제", "p": 100, "f": 101, "g": 1}, {"c": "06", "u": "상주감리", "q": "건축 분야의 <b>건축사보 한 명 이상</b>을 전체 공사기간 동안 공사현장에서 감리업무를 수행하게 하여야 하는 대상 건축공사에 속하지 <b>않는</b> 것은?", "o": ["16층 아파트의 건축공사", "준다중이용 건축물의 건축공사", "바닥면적 합계가 5,000㎡인 의료시설 중 종합병원의 건축공사", "바닥면적 합계가 2,000㎡인 숙박시설 중 일반숙박시설의 건축공사"], "a": 3, "v": "2,000㎡ 숙박시설은 해당 없음", "e": "상주감리 대상은 <b>바닥면적 합계 5,000㎡ 이상</b>, <b>연속 5개 층 이상이면서 3,000㎡ 이상</b>, <b>아파트</b>, <b>준다중이용 건축물</b>의 네 가지다. 2,000㎡ 숙박시설은 어디에도 들지 않는다.", "s": "면적 기준은 <b>용도를 가리지 않는다</b>. 보기에 \"○○시설 2,000㎡\"처럼 용도와 작은 면적이 함께 나오면 대상이 아니다.", "l": "건축법 제25조 · 시행령 제19조", "r": "같은 유형 5년간 4회 출제", "p": 102, "f": 103, "g": 2}, {"c": "06", "u": "사용승인", "q": "건축법상 <b>사용승인신청</b>을 받은 경우 허가권자는 신청서를 받은 날부터 며칠 이내에 사용승인을 위한 <b>현장검사</b>를 실시하여야 하는가?", "o": ["3일 이내", "5일 이내", "7일 이내", "10일 이내"], "a": 2, "v": "7일 이내", "e": "허가권자는 사용승인신청서를 받은 날부터 <b>7일 이내</b>에 현장검사를 실시하고, 검사에 합격한 건축물에 대하여 사용승인서를 내주어야 한다.", "s": "이 조문의 숫자는 둘 — 현장검사 <b>7일</b>, 임시사용승인 <b>2년 이내</b>. 사용승인을 받으면 다른 법의 준공검사·사용검사 등이 <b>의제</b>된다는 것도 함께 나온다.", "l": "건축법 제22조 · 시행규칙 제16조", "r": "5년간 1회 출제", "p": 104, "f": 105, "g": 3}, {"c": "06", "u": "허가·신고사항의 변경", "q": "건축주가 허가를 받았거나 신고를 한 사항을 <b>변경</b>하고자 할 때에 관한 설명 중 <b>틀린</b> 것은?", "o": ["바닥면적의 합계가 85㎡를 초과하는 부분에 대한 개축은 허가를 받는다.", "건축주를 변경하는 경우에는 허가를 받는다.", "건축물의 동수나 층수의 변경 없이 연면적 합계의 1/10 이하로 변경하는 경우에는 사용승인 시 일괄 신고한다.", "건축물의 층수 변경 없이 변경되는 높이가 1m 이하인 경우에는 사용승인 시 일괄 신고한다."], "a": 1, "v": "건축주 변경은 허가가 아니라 신고", "e": "<b>건축주·설계자·공사시공자·공사감리자를 변경하는 경우는 \"신고\"</b> 사항이다. 허가를 다시 받아야 하는 것은 <b>바닥면적 85㎡를 초과하는 신축·증축·개축에 해당하는 변경</b>뿐이다.", "s": "가르는 기준은 하나다 — <b>사람이 바뀌면 신고, 면적이 85㎡ 넘게 바뀌면 허가</b>. 작은 변경은 공사 중에 그냥 진행하고 <b>사용승인을 신청할 때 일괄 신고</b>한다.", "l": "건축법 제16조 · 시행령 제12조", "r": "5년간 1회 출제 (건축신고 85㎡와 짝을 이룬다)", "p": 106, "f": 107, "g": 4}, {"c": "06", "u": "특별건축구역", "q": "<b>특별건축구역</b>에 건축하는 건축물에 대하여 적용하지 아니할 수 있는 건축법의 내용이 <b>아닌</b> 것은?", "o": ["건축물의 높이 제한", "대지와 도로와의 관계", "대지 안의 조경", "건축물의 건폐율"], "a": 1, "v": "대지와 도로와의 관계", "e": "특별건축구역에서 적용을 <b>배제</b>할 수 있는 것은 <b>조경·건폐율·용적률·대지 안의 공지·높이 제한·일조 등의 확보를 위한 높이 제한</b> 여섯이다. <b>대지와 도로의 관계(접도의무)</b>는 배제 대상이 아니다.", "s": "배제되는 여섯은 모두 <b>\"얼마나 크게 지을 수 있는가\"</b>에 관한 것이다. 피난·내화·방화지구·마감재료·지하층은 배제가 아니라 <b>완화하여 적용</b>할 수 있을 뿐이다.", "l": "건축법 제69조 · 제73조", "r": "같은 유형 5년간 3회 출제", "p": 108, "f": 109, "g": 5}, {"c": "06", "u": "지능형건축물", "q": "다음 중 <b>지능형건축물</b>로 인증을 받은 건축물에 대하여 허가권자가 <b>완화</b>하여 적용할 수 있는 건축법의 내용이 <b>아닌</b> 것은?", "o": ["건축물의 용적률", "건폐율", "대지 안의 조경", "건축물의 높이 제한"], "a": 1, "v": "건폐율", "e": "지능형건축물 인증을 받으면 <b>조경 기준을 100분의 85까지</b>, <b>용적률과 높이 제한을 100분의 115의 범위</b>에서 완화할 수 있다. <b>건폐율은 완화 대상이 아니다.</b>", "s": "비슷한 완화 제도를 함께 외운다 — 리모델링이 쉬운 구조 <b>120%</b>, 공개공지 설치 <b>1.2배</b>, 지능형건축물 <b>조경 85% / 용적률·높이 115%</b>.", "l": "건축법 제65조의2", "r": "5년간 1회 출제", "p": 110, "f": 111, "g": 6}, {"c": "06", "u": "가설건축물", "q": "도시·군계획시설 또는 도시·군계획시설 예정지에 건축하는 <b>가설건축물</b>에 관한 기준 내용으로 옳지 <b>않은</b> 것은?", "o": ["조적조가 아닐 것", "철근콘크리트조가 아닐 것", "철골철근콘크리트조가 아닐 것", "판매시설로서 분양을 목적으로 건축하는 건축물이 아닐 것"], "a": 0, "v": "조적조 금지 규정은 없다", "e": "구조에 관한 제한은 <b>철근콘크리트조 또는 철골철근콘크리트조가 아닐 것</b>뿐이다. <b>조적조(벽돌조)를 금지하는 규정은 없다.</b>", "s": "허가 기준은 다섯이다 — <b>3층 이하 / 철근·철골철근콘크리트조가 아닐 것 / 존치기간 3년 이내 / 새 간선 공급설비가 필요 없을 것 / 분양 목적이 아닐 것.</b>", "l": "건축법 제20조 · 시행령 제15조", "r": "5년간 1회 출제", "p": 112, "f": 113, "g": 7}, {"c": "07", "u": "공개공지 대상 지역", "q": "지역의 환경을 쾌적하게 조성하기 위하여 대통령령으로 정하는 용도와 규모의 건축물에 <b>공개 공지 또는 공개 공간</b>을 설치하여야 하는 대상 지역에 속하지 <b>않는</b> 것은?", "o": ["준주거지역", "준공업지역", "전용주거지역", "일반주거지역"], "a": 2, "v": "전용주거지역", "e": "대상 지역은 <b>일반주거지역·준주거지역·상업지역·준공업지역</b>과, 특별자치시장·특별자치도지사 또는 시장·군수·구청장이 <b>도시화의 가능성이 크다고 인정하여 지정·공고하는 지역</b>이다. <b>전용주거지역만 빠진다.</b>", "s": "공개공지는 불특정 다수를 부르는 시설에 붙는 의무다. <b>조용한 주거 전용 지역은 뺀다</b>고 이해하면 보기를 볼 필요가 없다.", "l": "건축법 제43조 제1항 · 시행령 제27조의2", "r": "5년간 5회 출제 — 이 단원 최다", "p": 116, "f": 117, "g": 1}, {"c": "07", "u": "대지의 조경", "q": "다음은 대지의 조경에 관한 기준 내용이다. ( ) 안에 알맞은 것은?<br><span class=\"qx\">면적이 ( ) 이상인 대지에 건축을 하는 건축주는 용도지역 및 건축물의 규모에 따라 해당 지방자치단체의 조례로 정하는 기준에 따라 대지에 조경이나 그 밖에 필요한 조치를 하여야 한다.</span>", "o": ["100㎡", "150㎡", "180㎡", "200㎡"], "a": 3, "v": "200㎡", "e": "면적이 <b>200㎡ 이상</b>인 대지에 건축할 때 조경 의무가 생긴다. 몇 퍼센트를 심을지는 법이 정하지 않고 <b>조례</b>가 정한다.", "s": "이 조문에서 법이 정하는 숫자는 <b>200㎡ 하나</b>뿐이다. 비율(10%·15% 등)은 전부 조례 소관이므로 문제에 주어진다.", "l": "건축법 제42조 제1항", "r": "5년간 4회 출제", "p": 118, "f": 119, "g": 2}, {"c": "07", "u": "대지의 분할제한", "q": "건축물이 있는 대지의 분할제한에 관한 기준에서 \"대통령령으로 정하는 범위\"로 옳지 <b>않은</b> 것은?", "o": ["주거지역 : 100㎡ 이상", "상업지역 : 150㎡ 이상", "공업지역 : 150㎡ 이상", "녹지지역 : 200㎡ 이상"], "a": 0, "v": "주거지역은 60㎡", "e": "분할 후 남는 대지의 최소면적은 <b>주거 60㎡ · 상업 150㎡ · 공업 150㎡ · 녹지 200㎡ · 그 밖의 지역 60㎡</b>다. 주거지역 100㎡는 틀렸다.", "s": "<b>60 · 150 · 150 · 200 · 60</b> — 주거와 '그 밖'이 같고, 상업과 공업이 같고, 녹지만 크다. 보기에 주거 100㎡가 보이면 그것이 답이다.", "l": "건축법 제57조 · 시행령 제80조", "r": "5년간 3회 출제", "p": 120, "f": 121, "g": 3}, {"c": "07", "u": "도로모퉁이의 건축선", "q": "너비 4m인 두 도로가 <b>직각(90°)</b>으로 만나는 모퉁이에 있는 대지의 <b>건축선에 의한 공제 면적</b>은?", "o": ["2㎡", "3㎡", "4.5㎡", "8㎡"], "a": 0, "v": "2㎡", "e": "너비 8m 미만인 도로가 교차각 <b>90° 이상 120° 미만</b>으로 만나고 두 도로 모두 <b>4m 이상 6m 미만</b>이면 교차점에서 각 <b>2m</b>씩 후퇴한다. 잘려 나가는 직각삼각형의 넓이는 <b>2 × 2 × ½ = 2㎡</b>.", "s": "공제면적은 언제나 <b>후퇴거리 × 후퇴거리 ÷ 2</b>다. 2m면 2㎡, 3m면 4.5㎡, 4m면 8㎡. 문제는 표에서 후퇴거리 하나만 찾으면 끝난다.", "l": "건축법 제46조 제1항 · 시행령 제31조 제1항", "r": "5년간 3회 출제 (그림형으로 자주 나온다)", "p": 122, "f": 123, "g": 4}, {"c": "07", "u": "건축선에 따른 건축제한", "q": "다음의 건축선에 따른 건축제한에 관한 기준 내용 중 ( ) 안에 알맞은 것은?<br><span class=\"qx\">도로면으로부터 높이 ( ) 이하에 있는 출입구, 창문, 그 밖에 이와 유사한 구조물은 열고 닫을 때 건축선의 수직면을 넘지 아니하는 구조로 하여야 한다.</span>", "o": ["3m", "3.5m", "4m", "4.5m"], "a": 3, "v": "4.5m", "e": "도로면으로부터 높이 <b>4.5m 이하</b>에 있는 출입구·창문 등은 <b>열고 닫을 때에도</b> 건축선의 수직면을 넘지 않아야 한다. 통행하는 사람과 차에 부딪히지 않게 하려는 규정이다.", "s": "제47조는 두 항뿐이다 — <b>제1항</b> 건축물과 담장은 수직면을 넘을 수 없다(지표 아래는 예외), <b>제2항</b> 4.5m 이하의 여닫이 구조물은 열 때에도 넘을 수 없다.", "l": "건축법 제47조 제2항", "r": "5년간 3회 출제", "p": 124, "f": 125, "g": 5}, {"c": "07", "u": "공개공지 대상 건축물", "q": "건축물의 대지에 <b>공개 공지 또는 공개 공간</b>을 확보해야 하는 대상 건축물에 속하지 <b>않는</b> 것은? (단, 일반주거지역이며 해당 용도로 쓰는 바닥면적의 합계가 5,000㎡ 이상인 건축물)", "o": ["운동시설", "숙박시설", "업무시설", "문화 및 집회시설"], "a": 0, "v": "운동시설", "e": "대상은 <b>문화 및 집회시설 · 종교시설 · 판매시설(농수산물유통시설 제외) · 운수시설(여객용) · 업무시설 · 숙박시설</b>과 그 밖에 조례로 정하는 다중이용 건축물이다. <b>운동시설은 없다.</b>", "s": "공개공지 문항은 둘 중 하나다 — <b>지역</b>을 물으면 전용주거지역, <b>건축물</b>을 물으면 운동시설. 면적 문턱은 연면적이 아니라 <b>해당 용도로 쓰는 바닥면적의 합계 5,000㎡</b>다.", "l": "건축법 제43조 · 시행령 제27조의2 제1항", "r": "5년간 3회 출제", "p": 126, "f": 127, "g": 6}, {"c": "07", "u": "옥상조경의 산입", "q": "대지면적이 <b>600㎡</b>이고 조경면적이 대지면적의 <b>15%</b>로 정해진 지역에 건축물을 신축할 때, <b>옥상에 조경을 90㎡</b> 시공하였다면 지표면의 조경면적은 최소 얼마 이상이어야 하는가?", "o": ["0㎡", "30㎡", "45㎡", "60㎡"], "a": 2, "v": "45㎡", "e": "필요 조경면적은 600 × 15% = <b>90㎡</b>. 옥상조경은 시공면적의 <b>3분의 2</b>만 인정되므로 90 × 2/3 = 60㎡이지만, <b>전체 조경면적의 100분의 50</b>(= 45㎡)을 넘을 수 없다. 따라서 옥상 인정분은 45㎡, 지표면에 90 − 45 = <b>45㎡</b>를 확보해야 한다.", "s": "자르는 곳이 <b>두 번</b>이다 — 먼저 <b>2/3</b>, 그 다음 <b>전체 조경의 1/2</b> 상한. 두 번째를 빠뜨리면 30㎡라는 매력적인 오답이 나온다.", "l": "건축법 시행령 제27조 제3항", "r": "5년간 2회 출제 (계산형)", "p": 128, "f": 129, "g": 7}, {"c": "08", "u": "직통계단", "q": "직통계단의 설치 기준이다. ( ) 안에 알맞은 것은?<span class=\"qx\">피난층 외의 층 — 거실 각 부분에서 직통계단까지의 <b>보행거리</b> ( ㉠ ) 이하<br>단, 주요구조부가 내화구조 또는 불연재료인 건축물 — ( ㉡ ) 이하</span>", "o": ["㉠ 20m, ㉡ 40m", "㉠ 30m, ㉡ 50m", "㉠ 30m, ㉡ 40m", "㉠ 40m, ㉡ 60m"], "a": 1, "v": "㉠ 30m, ㉡ 50m", "e": "원칙은 <b>30m</b>, 주요구조부가 내화구조 또는 불연재료이면 <b>50m</b>다. 다만 <b>16층 이상인 공동주택</b>은 그 완화가 <b>40m</b>까지만 허용된다.", "s": "세 숫자가 계단처럼 놓인다 — <b>원칙 30 → 내화·불연 50 → 16층 이상 공동주택은 40</b>.", "l": "건축법 시행령 제34조", "r": "보행거리는 직선거리가 아니라 걸어가는 경로 길이", "p": 132, "f": 133, "g": 1}, {"c": "08", "u": "피난계단", "q": "건축법령상 피난계단 및 특별피난계단의 설치에 관한 기준 내용으로 옳지 <b>않은</b> 것은?", "o": ["5층 이상 또는 지하 2층 이하인 층에 설치하는 직통계단은 피난계단 또는 특별피난계단으로 설치하여야 한다", "11층 이상(공동주택의 경우 16층 이상)인 층으로부터 피난층 또는 지상으로 통하는 직통계단은 특별피난계단으로 설치하여야 한다", "지하 3층 이하인 층으로부터 피난층 또는 지상으로 통하는 직통계단은 특별피난계단으로 설치하여야 한다", "5층 이상인 층이 판매시설의 용도로 쓰이는 경우 그 층으로부터의 직통계단은 모두 특별피난계단으로 설치하여야 한다"], "a": 3, "v": "모두가 아니라 1개소 이상", "e": "판매시설의 경우 그 층으로부터의 직통계단 중 <b>1개소 이상</b>을 특별피난계단으로 설치하면 된다. ‘모두’가 아니다.", "s": "지상과 지하가 짝을 이룬다 — <b>5층 / 지하 2층은 피난계단, 11층 / 지하 3층은 특별피난계단</b>.", "l": "건축법 시행령 제35조", "r": "특별피난계단은 노대 또는 부속실을 거쳐 들어간다", "p": 134, "f": 135, "g": 2}, {"c": "08", "u": "방화구획", "q": "주요구조부가 내화구조인 건축물로서 연면적이 1,000㎡를 넘는 것은 방화구획을 하여야 한다. <b>10층 이하의 층</b>에 스프링클러를 설치한 경우 방화구획의 바닥면적 기준은?", "o": ["1,000㎡ 이내마다", "1,500㎡ 이내마다", "2,000㎡ 이내마다", "3,000㎡ 이내마다"], "a": 3, "v": "3,000㎡ 이내마다", "e": "10층 이하는 원칙 <b>1,000㎡</b>이고, 스프링클러 등 자동식 소화설비를 설치하면 <b>3배인 3,000㎡</b>가 된다.", "s": "스프링클러를 달면 <b>세 배</b>다 — 1,000→3,000 / 200→600 / 500→1,500. 세 쌍 모두 3배로 외운다.", "l": "건축법 시행령 제46조 · 피난방화규칙 제14조", "r": "방화구획은 구조·피난 단원 최다 빈출", "p": 136, "f": 137, "g": 3}, {"c": "08", "u": "계단", "q": "건축법령상 계단의 설치기준으로 옳지 <b>않은</b> 것은?", "o": ["높이가 3m를 넘는 계단에는 높이 3m 이내마다 유효너비 120cm 이상의 계단참을 설치할 것", "높이가 1m를 넘는 계단 및 계단참의 양옆에는 난간을 설치할 것", "계단의 유효 높이는 1.8m 이상으로 할 것", "초등학교 계단의 단높이는 16cm 이하, 단너비는 26cm 이상으로 할 것"], "a": 2, "v": "유효 높이는 2.1m 이상", "e": "계단의 유효 높이(바닥 마감면부터 상부 구조체 하부 마감면까지)는 <b>2.1m 이상</b>이다. 1.8m는 복도 너비 쪽 숫자다.", "s": "네 숫자를 한 벌로 — <b>3m(계단참) · 1.2m(계단참 너비) · 1m(난간) · 2.1m(유효높이)</b>.", "l": "피난·방화구조 규칙 제15조", "r": "단높이만 학교급에 따라 갈린다", "p": 138, "f": 139, "g": 4}, {"c": "08", "u": "복도", "q": "건축법령상 복도의 유효너비 기준으로 옳지 <b>않은</b> 것은? (양옆에 거실이 있는 복도의 경우)", "o": ["유치원 — 2.4m 이상", "고등학교 — 2.4m 이상", "공동주택 — 1.8m 이상", "해당 층 거실의 바닥면적 합계가 200㎡ 이상인 경우 — 1.2m 이상"], "a": 3, "v": "1.5m 이상", "e": "해당 층 거실의 바닥면적 합계가 <b>200㎡ 이상</b>(지하층은 100㎡ 이상)인 경우 양옆에 거실이 있는 복도는 <b>1.5m 이상</b>(의료시설은 1.8m 이상)이다. <b>1.2m는 ‘그 밖의 복도’</b> 쪽 숫자다.", "s": "네 숫자가 두 줄로 겹친다 — <b>학교 2.4 / 1.8</b>, <b>공동주택·오피스텔 1.8 / 1.2</b>, <b>200㎡ 이상 1.5 / 1.2</b>.", "l": "피난·방화구조 규칙 제15조의2", "r": "의료시설만 1.8m로 튄다", "p": 140, "f": 141, "g": 5}, {"c": "08", "u": "옥상광장", "q": "건축법령상 옥상광장 등의 설치에 관한 기준 내용으로 옳지 <b>않은</b> 것은?", "o": ["옥상광장 또는 2층 이상인 층에 있는 노대등의 주위에는 높이 1.2m 이상의 난간을 설치하여야 한다", "5층 이상인 층이 판매시설의 용도로 쓰이는 경우에는 피난 용도로 쓸 수 있는 광장을 옥상에 설치하여야 한다", "층수가 11층 이상인 건축물로서 11층 이상인 층의 바닥면적의 합계가 1만㎡ 이상인 건축물의 옥상에는 헬리포트를 설치하거나 인명 등을 구조할 수 있는 공간을 확보하여야 한다", "헬리포트의 길이와 너비는 각각 15m 이상으로 하여야 한다"], "a": 3, "v": "22m 이상", "e": "헬리포트의 길이와 너비는 각각 <b>22m 이상</b>이다. 15m는 <b>옥상 바닥의 길이와 너비가 각각 22m 이하</b>인 경우에 한해 줄일 수 있는 하한이다.", "s": "옥상의 숫자 세 개 — <b>난간 1.2m</b>, <b>헬리포트 22m</b>(감축 15m), <b>인명구조공간 직경 10m</b>.", "l": "건축법 시행령 제40조 · 피난방화규칙 제13조", "r": "22 / 15 / 10 세 숫자", "p": 142, "f": 143, "g": 6}, {"c": "08", "u": "방화문", "q": "건축법령상 방화문의 구분에 관한 내용으로 옳은 것은?", "o": ["60분+ 방화문 — 연기 및 불꽃을 차단할 수 있는 시간이 60분 이상이고, 열을 차단할 수 있는 시간이 30분 이상인 방화문", "60분+ 방화문 — 연기 및 불꽃을 차단할 수 있는 시간이 90분 이상인 방화문", "60분 방화문 — 연기 및 불꽃을 차단할 수 있는 시간이 60분 이상이고, 열을 차단할 수 있는 시간이 60분 이상인 방화문", "30분 방화문 — 연기 및 불꽃을 차단할 수 있는 시간이 30분 이상 45분 미만인 방화문"], "a": 0, "v": "60분+ = 연기·불꽃 60분 + 열 30분", "e": "이름의 <b>‘+’가 열 차단 30분</b>을 뜻한다. 60분+와 60분은 연기·불꽃 차단 시간이 똑같이 60분이고, 갈리는 것은 <b>열을 30분 막느냐</b> 하나뿐이다.", "s": "연기·불꽃은 이름값 그대로 <b>60 / 60 / 30</b>. 다른 것은 <b>60분+에만 붙는 열 30분</b> 하나뿐이다.", "l": "건축법 시행령 제64조", "r": "구 ‘갑종·을종 방화문’이 2021년에 이 이름으로 바뀌었다", "p": 144, "f": 145, "g": 7}, {"c": "09", "u": "옥상광장 · 노대의 난간", "q": "다음의 옥상광장 등의 설치에 관한 기준 내용 중 ( ) 안에 알맞은 것은?<br><span class=\"qx\">옥상광장 또는 2층 이상인 층에 있는 노대나 그 밖에 이와 비슷한 것의 주위에는 높이 ( ) 이상의 난간을 설치하여야 한다. 다만, 그 노대 등에 출입할 수 없는 구조인 경우에는 그러하지 아니하다.</span>", "o": ["1.0m", "1.2m", "1.5m", "1.8m"], "a": 1, "v": "1.2m", "e": "난간 높이는 <b>1.2m 이상</b>이다. 사람의 가슴 높이로, 기대도 넘어가지 않을 정도를 기준으로 삼는다.", "s": "이 조문의 대상은 옥상광장만이 아니다 — <b>2층 이상인 층에 있는 노대</b>도 포함된다. 다만 <b>출입할 수 없는 구조</b>이면 난간을 두지 않아도 된다.", "l": "건축법 시행령 제40조 제1항", "r": "5년간 4회 출제 — 이 세트 최다", "p": 148, "f": 149, "g": 1}, {"c": "09", "u": "피난안전구역", "q": "다음은 건축물 중간층에 설치하는 대피공간인 <b>피난안전구역</b>에 관한 기준 내용이다. ( ) 안에 알맞은 것은?<br><span class=\"qx\">초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역을 지상층으로부터 최대 ( ) 층마다 1개소 이상 설치하여야 한다.</span>", "o": ["10개", "20개", "30개", "40개"], "a": 2, "v": "30개 층마다", "e": "초고층 건축물은 지상층으로부터 <b>최대 30개 층마다 1개소 이상</b> 피난안전구역을 둔다. 초고층은 <b>50층 이상 또는 높이 200m 이상</b>이므로, 60층이면 30층과 60층 부근에 두 곳이 된다.", "s": "짝은 준초고층(30~49층) — <b>전체 층수의 1/2 층으로부터 상하 5개 층 이내</b>에 1개소 이상.", "l": "건축법 제50조의2 · 시행령 제34조 제3항", "r": "5년간 3회 출제", "p": 150, "f": 151, "g": 2}, {"c": "09", "u": "배연설비 대상", "q": "건축물의 거실에 국토교통부령으로 정하는 기준에 따라 <b>배연설비</b>를 하여야 하는 대상 건축물에 속하지 <b>않는</b> 것은? (단, 피난층의 거실은 제외하며 6층 이상인 건축물의 경우)", "o": ["숙박시설", "판매시설", "위락시설", "공동주택"], "a": 3, "v": "공동주택", "e": "6층 이상 건축물의 배연설비 대상에는 문화 및 집회시설·종교·판매·운수·의료·업무·숙박·위락시설 등이 줄줄이 들어가지만 <b>공동주택은 없다</b>. 사람이 사는 곳은 창을 열면 되기 때문이다.", "s": "보기 넷 중 <b>공동주택</b>이 보이면 그것이 답이다. 조건에 붙는 두 단서 — <b>6층 이상</b>, 그리고 <b>피난층의 거실은 제외</b> — 도 자주 물어본다.", "l": "건축법 시행령 제51조 제2항 · 설비규칙 제14조", "r": "5년간 3회 출제", "p": 152, "f": 153, "g": 3}, {"c": "09", "u": "반자높이", "q": "문화 및 집회시설 중 집회장의 용도에 쓰이는 건축물의 <b>집회실로서 바닥면적이 200㎡ 이상</b>인 경우, 반자 높이는 최소 얼마 이상이어야 하는가? (단, 기계환기장치를 설치하지 않은 경우)", "o": ["1.8m", "2.1m", "2.7m", "4.0m"], "a": 3, "v": "4.0m", "e": "거실의 반자높이는 원칙적으로 <b>2.1m 이상</b>이지만, 문화 및 집회시설 등의 <b>관람실 또는 집회실로서 바닥면적 200㎡ 이상</b>인 것은 <b>4m 이상</b>이다.", "s": "세 숫자가 한 조문 안에 있다 — <b>2.1(일반 거실) / 4.0(200㎡ 이상 관람실·집회실) / 2.7(그 노대 아랫부분)</b>. 보기 넷 중 셋이 이 조문에서 나온다.", "l": "피난방화규칙 제16조", "r": "5년간 3회 출제 (공동주택 거실 2.1m 형태까지 5회)", "p": 154, "f": 155, "g": 4}, {"c": "09", "u": "개별관람석의 출구", "q": "문화 및 집회시설 중 공연장의 <b>개별관람석의 출구</b>에 관한 설명으로 옳은 것은? (단, 개별관람석의 바닥면적은 900㎡이다.)", "o": ["각 출구의 유효너비는 1.2m 이상이어야 한다.", "관람석별로 최소 4개소 이상 설치하여야 한다.", "관람석으로부터 바깥쪽으로의 출구로 쓰이는 문은 안여닫이로 하여야 한다.", "개별관람석 출구의 유효너비 합계는 최소 5.4m 이상으로 하여야 한다."], "a": 3, "v": "합계 5.4m 이상", "e": "유효너비 합계는 개별관람석 바닥면적 <b>100㎡마다 0.6m</b>의 비율로 산정한다. 900 ÷ 100 × 0.6 = <b>5.4m 이상</b>.", "s": "적용 문턱은 개별관람석 <b>300㎡ 이상</b>이다. 그 아래는 이 규정이 아예 없다. 세 숫자를 함께 외운다 — <b>300㎡(문턱) · 2개소 · 1.5m · 100㎡당 0.6m</b>.", "l": "피난방화규칙 제10조", "r": "5년간 2회 출제 (각 출구 1.5m 형태까지 4회)", "p": 156, "f": 157, "g": 5}, {"c": "09", "u": "거실의 채광 및 환기", "q": "<b>환기</b>를 위하여 단독주택의 거실에 설치하는 창문 등의 면적은 그 거실의 바닥면적의 최소 얼마 이상이어야 하는가? (단, 기계환기장치 및 중앙관리방식의 공기조화설비를 설치하지 않은 경우)", "o": ["1/5", "1/10", "1/15", "1/20"], "a": 3, "v": "1/20", "e": "환기용 창문 등의 면적은 거실 바닥면적의 <b>20분의 1 이상</b>이다. <b>채광</b>용은 그 두 배인 <b>10분의 1 이상</b>이다.", "s": "<b>채광 1/10 · 환기 1/20</b> — 환기가 절반이다. 둘을 바꿔 내는 것이 이 문항의 전부다. 적용 대상은 <b>단독주택·공동주택의 거실, 학교의 교실, 의료시설의 병실, 숙박시설의 객실</b>이다.", "l": "건축법 시행령 제51조 제1항 · 피난방화규칙 제17조", "r": "5년간 2회 출제", "p": 158, "f": 159, "g": 6}, {"c": "09", "u": "복합건축물의 피난시설", "q": "다음은 같은 건축물 안에 <b>공동주택과 위락시설</b>을 함께 설치하고자 하는 경우에 관한 기준 내용이다. ( ) 안에 알맞은 것은?<br><span class=\"qx\">공동주택의 출입구와 위락시설의 출입구는 서로 그 보행거리가 ( ) 이상이 되도록 설치할 것</span>", "o": ["10m", "20m", "30m", "50m"], "a": 2, "v": "30m", "e": "두 출입구 사이의 보행거리는 <b>30m 이상</b>이다. 애초에 이 두 용도는 같은 건축물에 함께 둘 수 없는 것이 원칙이고, 네 가지 조건을 모두 갖춘 경우에만 예외로 허용된다.", "s": "숫자는 <b>30m</b> 하나다. CH08의 직통계단 보행거리 30m와 같은 숫자이지만 조문도 대상도 다르다 — 함께 외워 두면 헷갈리지 않는다.", "l": "건축법 시행령 제47조 제2항", "r": "5년간 3회 출제", "p": 160, "f": 161, "g": 7}, {"c": "10", "u": "내화구조 대상", "q": "다음 중 주요구조부를 <b>내화구조</b>로 하여야 하는 대상 건축물에 속하지 <b>않는</b> 것은?", "o": ["문화 및 집회시설(전시장 및 동식물원 제외)의 용도에 쓰이는 건축물로서 옥내 관람석 또는 집회실의 바닥면적의 합계가 300㎡인 건축물", "관광휴게시설의 용도에 쓰이는 건축물로서 그 용도에 쓰이는 바닥면적의 합계가 600㎡인 건축물", "공장의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 1,000㎡인 건축물", "건축물의 2층이 숙박시설의 용도에 쓰이는 건축물로서 그 용도에 쓰이는 바닥면적의 합계가 400㎡인 건축물"], "a": 2, "v": "공장은 2,000㎡ 이상", "e": "<b>공장</b>의 문턱은 <b>2,000㎡</b>다. 1,000㎡는 그 아래이므로 내화구조 대상이 아니다. 나머지 셋은 각각 200㎡·500㎡·400㎡ 문턱을 넘는다.", "s": "문턱이 넷이다 — <b>200(관람·집회실) / 400(2층이 주택·숙박 등) / 500(판매·전시장 등) / 2,000(공장)</b>. 여기에 면적과 무관한 <b>3층 이상 · 지하층이 있는 건축물</b>이 더해진다.", "l": "건축법 제50조 · 시행령 제56조", "r": "같은 유형 5년간 4회 출제", "p": 164, "f": 165, "g": 1}, {"c": "10", "u": "방화구조", "q": "다음 중 <b>방화구조</b>에 해당하지 <b>않는</b> 것은?", "o": ["철망모르타르로서 그 바름두께가 1.5cm인 것", "시멘트모르타르 위에 타일을 붙인 것으로서 그 두께의 합계가 2.5cm인 것", "석고판 위에 회반죽을 바른 것으로서 그 두께의 합계가 2.5cm인 것", "석고판 위에 시멘트모르타르를 바른 것으로서 그 두께의 합계가 2.5cm인 것"], "a": 0, "v": "철망모르타르는 2cm 이상", "e": "<b>철망모르타르</b>는 바름두께 <b>2cm 이상</b>이어야 방화구조다. 1.5cm는 미달이다. 나머지 셋은 모두 두께의 합계 <b>2.5cm 이상</b>이 기준이고 보기가 정확히 그 값이다.", "s": "<b>철망모르타르만 2cm, 나머지는 2.5cm</b>. 두께 없이 인정되는 것도 둘 있다 — <b>심벽에 흙으로 맞벽치기</b>한 것과 <b>한국산업표준 방화 2급 이상</b>.", "l": "피난방화규칙 제4조", "r": "5년간 2회 출제", "p": 166, "f": 167, "g": 2}, {"c": "10", "u": "내화구조의 두께", "q": "다음 중 <b>내화구조</b>에 해당하지 <b>않는</b> 것은? (단, 외벽 중 비내력벽인 경우)", "o": ["철근콘크리트조로서 두께가 7cm인 것", "무근콘크리트조로서 두께가 7cm인 것", "골구를 철골조로 하고 그 양면을 두께 3cm의 철망모르타르로 덮은 것", "철재로 보강된 콘크리트블록조로서 철재에 덮은 콘크리트블록의 두께가 3cm인 것"], "a": 3, "v": "철재 보강 블록조는 4cm 이상", "e": "외벽 중 비내력벽에서 <b>철재로 보강된 콘크리트블록조·벽돌조·석조</b>는 철재에 덮은 두께가 <b>4cm 이상</b>이어야 한다. 3cm는 미달이다.", "s": "<b>비내력 외벽은 내력벽보다 한 단계씩 얇아도 된다</b> — 철근콘크리트 10→7, 철망모르타르 4→3, 철재 보강 블록 5→4, 벽돌조 19→7cm.", "l": "피난방화규칙 제3조", "r": "같은 유형 5년간 2회 출제", "p": 168, "f": 169, "g": 3}, {"c": "10", "u": "특수구조 건축물", "q": "건축물을 건축하는 경우 설계자가 구조의 안전을 확인할 때 <b>건축구조기술사의 협력</b>을 받아야 하는 대상 건축물 기준으로 <b>틀린</b> 것은?", "o": ["다중이용건축물", "6층 이상인 건축물", "3층 이상의 필로티형식 건축물", "기둥과 기둥 사이의 거리가 10m 이상인 건축물"], "a": 3, "v": "10m가 아니라 20m", "e": "특수구조 건축물의 기준은 <b>기둥과 기둥 사이의 거리가 20m 이상</b>인 건축물이다. 10m라는 기준은 없다.", "s": "특수구조 건축물의 숫자는 둘 — <b>보·차양이 3m 이상 돌출</b>, <b>기둥 사이 20m 이상</b>. 보기의 10m·30m는 없는 숫자다.", "l": "건축법 시행령 제2조 제18호 · 제91조의3", "r": "5년간 2회 출제 ※ 시중 해설의 \"30m\"는 오류", "p": 170, "f": 171, "g": 4}, {"c": "10", "u": "대규모 목조건축물", "q": "목조 건축물의 외벽 및 처마 밑의 연소 우려가 있는 부분을 <b>방화구조</b>로 하고 지붕을 <b>불연재료</b>로 해야 하는 대규모 목조 건축물의 규모 기준은?", "o": ["연면적 500㎡ 이상", "연면적 1,000㎡ 이상", "연면적 1,500㎡ 이상", "연면적 2,000㎡ 이상"], "a": 1, "v": "연면적 1,000㎡ 이상", "e": "연면적 <b>1,000㎡ 이상</b>인 목조 건축물은 외벽·처마 밑의 <b>연소할 우려가 있는 부분</b>을 방화구조로 하고, 지붕은 <b>불연재료</b>로 해야 한다.", "s": "<b>1,000㎡</b>는 이 조문에서 두 번 나온다 — 목조의 방화구조 기준이자, <b>방화벽으로 구획</b>해야 하는 연면적 기준이다(각 구획은 1,000㎡ 미만).", "l": "건축법 시행령 제57조 · 피난방화규칙 제22조", "r": "5년간 1회 출제 (방화벽 계열 포함 3회)", "p": 172, "f": 173, "g": 5}, {"c": "10", "u": "방화벽의 구조", "q": "<b>방화벽</b>의 구조기준 내용으로 옳지 <b>않은</b> 것은?", "o": ["내화구조로서 홀로 설 수 있는 구조일 것", "방화벽의 양쪽 끝과 위쪽 끝을 건축물의 외벽면 및 지붕면으로부터 0.5m 이상 튀어 나오게 할 것", "방화벽에 설치하는 출입문에는 30분방화문을 설치할 것", "방화벽에 설치하는 출입문의 너비 및 높이는 각각 2.5m 이하로 할 것"], "a": 2, "v": "30분이 아니라 60분+ 또는 60분 방화문", "e": "방화벽의 출입문에는 <b>60분+ 방화문 또는 60분 방화문</b>을 설치해야 한다. 30분 방화문은 방화구획의 일부 용도에만 쓰이고 방화벽에는 쓸 수 없다.", "s": "숫자 셋 — <b>0.5m</b>(돌출) · <b>2.5m</b>(출입문) · <b>60분+</b>(방화문). 보기에 <b>30분방화문</b>이 보이면 그것이 틀린 보기다.", "l": "건축법 시행령 제57조 · 피난방화규칙 제21조", "r": "5년간 1회 출제 (방화지구 계열 포함 3회)", "p": 174, "f": 175, "g": 6}, {"c": "10", "u": "방화지구 안의 건축물", "q": "<b>방화지구</b> 안에서 주요구조부 및 외벽을 <b>내화구조로 하지 아니할 수 있는</b> 건축물의 용도는?", "o": ["단독주택", "도매시장", "오피스텔", "청소년수련관"], "a": 1, "v": "주요구조부가 불연재료인 도매시장", "e": "방화지구 안의 건축물은 주요구조부와 <b>지붕·외벽</b>을 내화구조로 해야 하지만, <b>주요구조부가 불연재료로 된 도매시장</b>은 예외다.", "s": "예외는 둘뿐이다 — <b>30㎡ 미만 단층 부속건축물</b>과 <b>주요구조부가 불연재료인 도매시장</b>. 방화지구에서는 <b>지붕과 외벽까지</b> 내화구조여야 한다는 점도 함께 나온다.", "l": "건축법 제51조 · 시행령 제58조", "r": "5년간 1회 출제 (걸치는 대지 형태 포함 3회)", "p": 176, "f": 177, "g": 7}, {"c": "11", "u": "지역·지구에 걸치는 대지", "q": "건축물의 대지가 지역·지구 또는 구역에 걸치는 경우의 조치에 관한 내용으로 옳지 <b>않은</b> 것은?", "o": ["대지가 지역·지구 또는 구역에 걸치는 경우 그 건축물과 대지의 전부에 대하여 대지의 과반이 속하는 지역·지구 또는 구역의 규정을 적용한다", "하나의 건축물이 방화지구와 그 밖의 구역에 걸치는 경우 그 전부에 대하여 방화지구 안의 건축물에 관한 규정을 적용한다", "건축물의 방화지구에 속한 부분과 그 밖의 구역에 속한 부분의 경계가 방화벽으로 구획되는 경우에도 건축물 전부에 방화지구 규정을 적용한다", "대지가 녹지지역과 그 밖의 지역에 걸치는 경우에는 각 지역 안의 건축물과 대지에 관한 규정을 적용한다"], "a": 2, "v": "방화벽으로 구획되면 예외", "e": "방화지구에 속한 부분과 그 밖의 부분의 경계가 <b>방화벽으로 구획</b>되면, 그 밖의 구역에 있는 부분에는 방화지구 규정을 적용하지 <b>않는다</b>.", "s": "세 글자로 묶는다 — 원칙은 <b>과반</b>, 방화지구는 <b>전부</b>, 녹지지역은 <b>각각</b>.", "l": "건축법 제54조 · 시행령 제77조", "r": "과반 / 전부 / 각각의 세 갈래", "p": 180, "f": 181, "g": 1}, {"c": "11", "u": "건폐율", "q": "국토의 계획 및 이용에 관한 법률상 용도지역별 <b>건폐율</b>의 최대한도가 옳지 <b>않은</b> 것은? (조례는 고려하지 않음)", "o": ["중심상업지역 — 90% 이하", "제2종 일반주거지역 — 60% 이하", "제3종 일반주거지역 — 60% 이하", "계획관리지역 — 40% 이하"], "a": 2, "v": "제3종 일반주거지역은 50%", "e": "일반주거지역은 1종 60 · 2종 60인데 <b>3종만 50%</b>로 떨어진다. 높이(용적률 300%)를 더 주는 대신 넓게 덮지는 못하게 한 것이다.", "s": "내려가며 외운다 — <b>90 · 80 · 70 · 60 · 50 · 40 · 20</b>. 일반주거 중 3종만 50으로 떨어진다.", "l": "건축법 제55조 · 국토계획법 제77조 · 시행령 제84조", "r": "이 챕터 최다 빈출", "p": 182, "f": 183, "g": 2}, {"c": "11", "u": "용적률", "q": "국토의 계획 및 이용에 관한 법률상 용도지역별 <b>용적률</b>의 최대한도가 가장 <b>큰</b> 것은?", "o": ["일반상업지역", "중심상업지역", "유통상업지역", "준주거지역"], "a": 1, "v": "중심상업지역 1,500%", "e": "상업지역 안에서도 <b>중심상업 1,500 → 일반상업 1,300 → 유통상업 1,100 → 근린상업 900</b> 순이다. 준주거는 500%로 주거지역 중 최대다.", "s": "건폐율 순서와 용적률 순서가 같지 않다 — 근린상업은 <b>건폐율 70(공업과 같다)</b>인데 <b>용적률 900(공업의 두 배 이상)</b>이다.", "l": "건축법 제56조 · 국토계획법 제78조 · 시행령 제85조", "r": "건폐율과 짝지어 출제된다", "p": 184, "f": 185, "g": 3}, {"c": "11", "u": "대지의 분할 제한", "q": "건축물이 있는 대지를 분할할 수 있는 최소 면적 기준이 옳지 <b>않은</b> 것은? (조례는 고려하지 않음)", "o": ["주거지역 — 60㎡", "상업지역 — 150㎡", "공업지역 — 200㎡", "녹지지역 — 200㎡"], "a": 2, "v": "공업지역은 150㎡", "e": "공업지역은 상업지역과 같은 <b>150㎡</b>다. 200㎡는 <b>녹지지역</b>의 숫자다.", "s": "네 숫자가 <b>60 · 150 · 150 · 200</b>이다 — 주거와 ‘그 밖’이 60, 상업과 공업이 150, 녹지가 200.", "l": "건축법 제57조 · 시행령 제80조", "r": "면적 기준과 ‘기준 미달 분할 금지’가 함께 나온다", "p": 186, "f": 187, "g": 4}, {"c": "11", "u": "일조 등의 확보", "q": "일조 등의 확보를 위한 높이 제한이다. ( ) 안에 알맞은 것은? (주거지역 · <b>2026. 11. 12. 시행</b>)<span class=\"qx\">높이 10m 이하인 부분 — 인접 대지경계선으로부터 ( ㉠ ) 이상<br>높이 10m 초과 17m 이하인 부분 — 인접 대지경계선으로부터 ( ㉡ ) 이상</span>", "o": ["㉠ 1.5m, ㉡ 3m", "㉠ 1.5m, ㉡ 5m", "㉠ 2m, ㉡ 5m", "㉠ 1.5m, ㉡ 해당 높이의 1/2"], "a": 1, "v": "㉠ 1.5m, ㉡ 5m", "e": "개정된 제61조 제1항은 <b>세 단</b>이다 — 10m 이하 <b>1.5m</b>, 10m 초과 17m 이하 <b>5m</b>, 17m 초과 <b>해당 부분 높이의 1/2</b>. 10~17m 구간이 새로 생기면서 완화되었다.", "s": "개정 전은 10m에서 바로 1/2, 개정 후는 <b>10 → 17 → 1/2</b>. 가운데에 5m 한 단이 끼어든다.", "l": "건축법 제61조 · 시행령 제86조", "r": "2027년 시험부터 3단이 정답", "p": 188, "f": 189, "g": 5}, {"c": "11", "u": "공동주택의 채광", "q": "공동주택의 일조 등의 확보를 위한 높이 제한 기준으로 옳지 <b>않은</b> 것은? (일반상업지역·중심상업지역에 건축하는 것은 제외)", "o": ["건축물의 각 부분의 높이는 채광을 위한 창문 등이 있는 벽면에서 직각 방향으로 인접 대지경계선까지의 수평거리의 2배 이하로 한다", "근린상업지역 또는 준주거지역의 건축물은 수평거리의 4배 이하로 한다", "같은 대지에서 두 동이 마주보는 경우 채광창이 있는 벽면으로부터 건축물 각 부분 높이의 0.5배(도시형 생활주택은 0.25배) 이상을 띄운다", "채광창이 없는 벽면과 측벽이 마주보는 경우에는 4m 이상을 띄운다"], "a": 3, "v": "8m 이상", "e": "<b>채광창이 없는 벽면과 측벽</b>이 마주보면 <b>8m 이상</b>이고, <b>측벽과 측벽</b>이 마주보면 <b>4m 이상</b>이다. 두 숫자가 바뀌어 있다.", "s": "평면에서 마주보는 두 숫자 — <b>채광창 없는 벽 ↔ 측벽 8m</b>, <b>측벽 ↔ 측벽 4m</b>. 벽이 넓을수록 멀리 띄운다.", "l": "건축법 제61조 ②항 · 시행령 제86조 ③항", "r": "2배 · 4배 · 0.5배 · 0.25배 · 1배 · 8m · 4m", "p": 190, "f": 191, "g": 6}, {"c": "11", "u": "맞벽건축과 연결복도", "q": "맞벽건축 및 연결복도에 관한 기준 내용으로 옳지 <b>않은</b> 것은?", "o": ["맞벽이란 두 건축물의 벽을 대지경계선으로부터 50cm 이내로 하여 건축하는 것을 말한다", "맞벽은 주요구조부가 내화구조이고 마감재료가 불연재료이어야 한다", "연결복도의 너비 및 높이는 각각 5m 이하이어야 한다", "연결복도가 밀폐된 구조인 경우 벽면적의 5분의 1 이상에 해당하는 면적의 창문을 설치하여야 한다"], "a": 3, "v": "10분의 1 이상", "e": "밀폐된 구조의 연결복도에는 <b>벽면적의 10분의 1 이상</b>의 창문을 설치한다. 다만 지하층으로서 환기설비를 설치하는 경우는 제외한다.", "s": "맞벽·연결복도이면 <b>대지 안의 공지(제58조) · 일조 높이 제한(제61조) · 민법 제242조</b> 셋을 적용하지 않는다.", "l": "건축법 제59조 · 시행령 제81조", "r": "50cm · 5m · 1/10 세 숫자", "p": 192, "f": 193, "g": 7}, {"c": "11", "u": "가로구역별 높이 제한", "q": "허가권자가 <b>가로구역</b>을 단위로 하여 건축물의 최고 높이를 지정·공고할 때 고려하여야 하는 사항에 속하지 <b>않는</b> 것은?", "o": ["도시·군관리계획 등의 토지이용계획", "해당 가로구역이 접하는 도로의 너비", "해당 가로구역을 통과하는 모든 차량의 통행량", "해당 가로구역의 상·하수도 등 간선시설의 수용능력"], "a": 2, "v": "차량의 통행량", "e": "시행령 제82조 제1항의 고려사항은 <b>다섯 가지</b>다 — 토지이용계획 · 도로의 너비 · 간선시설의 수용능력 · 도시미관 및 경관계획 · 장래 발전계획. <b>통행량이나 인구·방재계획은 들어 있지 않다</b>.", "s": "다섯 가지는 <b>토지 · 도로 · 시설 · 미관 · 장래</b> — 사람과 차의 숫자는 없다.", "l": "건축법 제60조 · 시행령 제82조", "r": "2024-2회 87번 · 04년 산업기사", "p": 194, "f": 195, "g": 8}, {"c": "12", "u": "승용승강기 설치대수", "q": "건축물의 층수가 23층이고 각 층의 거실면적이 1,000㎡인 <b>숙박시설</b>에 설치하여야 하는 승용승강기의 최소 대수는? (단, 8인승 승용승강기의 경우)", "o": ["7대", "8대", "9대", "10대"], "a": 2, "v": "9대", "e": "세는 면적은 <b>6층 이상 층의 거실면적 합계</b>다. 6~23층 = 18개 층 × 1,000㎡ = <b>18,000㎡</b>. 숙박시설은 3,000㎡ 이하 <b>1대</b> + 초과분 <b>2,000㎡마다 1대</b>이므로 1 + (18,000 − 3,000) ÷ 2,000 = 8.5 → 올림하여 <b>9대</b>.", "s": "함정은 셋 — <b>① 6층 이상만 센다 ② 거실면적이다(연면적 아님) ③ 소수는 올림한다.</b>", "l": "건축법 제64조 제1항 · 설비규칙 제5조 · 별표 1의2", "r": "건축설비 단일 최다 빈출 — 5년간 18회", "p": 198, "f": 199, "g": 1}, {"c": "12", "u": "피뢰설비", "q": "건축물의 설비기준 등에 관한 규칙에 따라 <b>피뢰설비를 설치하여야 하는 대상 건축물의 높이</b> 기준은?", "o": ["20m 이상", "30m 이상", "40m 이상", "50m 이상"], "a": 0, "v": "20m 이상", "e": "낙뢰의 우려가 있는 건축물, 공작물로서 높이 20m 이상인 것 또는 높이 <b>20m 이상</b>의 건축물에는 피뢰설비를 설치한다. 6층짜리 건물이 대략 이 높이다.", "s": "이 조문의 숫자는 셋 — <b>대상 20m · 돌침 25cm · 도선 50㎟</b>. 섞여 나와도 같은 조문이다.", "l": "건축법 시행령 제87조 제2항 · 설비규칙 제20조", "r": "5년간 4회 출제 (돌침 25cm 형태 포함 6회)", "p": 200, "f": 201, "g": 2}, {"c": "12", "u": "급수관의 지름", "q": "주거에 쓰이는 바닥면적의 합계가 <b>550㎡</b>인 주거용 건축물에 배관하여야 할 급수관의 최소 지름은? (단, 가구 구분이 불분명하고 가압설비는 없음)", "o": ["15mm", "20mm", "40mm", "50mm"], "a": 3, "v": "50mm", "e": "가구 또는 세대의 구분이 불분명한 건축물은 <b>바닥면적으로 가구수를 환산</b>한다. <b>500㎡를 초과하면 17가구</b>로 보고, 17가구 이상의 급수관 지름은 <b>50mm 이상</b>이다.", "s": "면적을 <b>가구수로 한 번 바꾸는 것</b>이 전부다. 300~500=16가구(40mm) / 500 초과=17가구(50mm).", "l": "설비규칙 제18조 · 별표 3", "r": "5년간 3회 출제 (가구수를 직접 주는 형태까지 9회)", "p": 202, "f": 203, "g": 3}, {"c": "12", "u": "개별난방설비", "q": "공동주택과 오피스텔의 난방설비를 <b>개별난방방식</b>으로 하는 경우에 관한 기준 내용으로 옳은 것은?", "o": ["보일러의 연도는 내화구조로서 공동연도로 설치할 것", "공동주택의 경우에는 난방구획을 방화구획으로 구획할 것", "보일러실의 윗부분에는 그 면적이 1㎡ 이상인 환기창을 설치할 것", "기름보일러를 설치하는 경우에는 기름저장소를 보일러실에 설치할 것"], "a": 0, "v": "연도는 내화구조 공동연도", "e": "보일러의 연도는 <b>내화구조로서 공동연도</b>로 설치해야 한다. 나머지 셋은 각각 대상·수치·위치를 한 칸씩 바꿔 놓은 것이다.", "s": "네 보기가 모두 <b>같은 조문 안</b>에 있다 — 대상(공동주택↔오피스텔) · 숫자(0.5↔1) · 위치(안↔밖).", "l": "설비규칙 제13조", "r": "5년간 3회 출제 (오피스텔·환기창 변형 포함 10회)", "p": 204, "f": 205, "g": 4}, {"c": "12", "u": "관계전문기술자의 협력", "q": "급수·배수·환기·난방 등의 건축설비를 설치하는 경우 <b>건축기계설비기술사 또는 공조냉동기계기술사의 협력</b>을 받아야 하는 대상 건축물에 속하지 <b>않는</b> 것은?", "o": ["아파트", "기숙사로서 해당 용도에 사용되는 바닥면적의 합계가 2,000㎡인 건축물", "판매시설로서 해당 용도에 사용되는 바닥면적의 합계가 2,000㎡인 건축물", "의료시설로서 해당 용도에 사용되는 바닥면적의 합계가 2,000㎡인 건축물"], "a": 2, "v": "판매시설 2,000㎡는 대상 아님", "e": "<b>판매시설·연구소·업무시설의 문턱은 3,000㎡</b>다. 2,000㎡는 그 아래이므로 대상이 아니다. 기숙사·의료시설은 2,000㎡가 문턱이므로 같은 면적이라도 대상이 된다.", "s": "문턱은 넷 — <b>500 / 2,000 / 3,000 / 10,000㎡</b>. 판매·연구소·업무가 3,000이라는 한 칸이 핵심.", "l": "건축법 시행령 제91조의3 제2항 · 설비규칙 제2조", "r": "5년간 3회 출제", "p": 206, "f": 207, "g": 5}, {"c": "12", "u": "층간바닥 차음구조", "q": "가구·세대 등 간 소음 방지를 위하여 건축물의 <b>층간바닥</b>(화장실의 바닥은 제외)을 국토교통부령으로 정하는 기준에 따라 설치하여야 하는 대상 건축물에 속하지 <b>않는</b> 것은?", "o": ["단독주택 중 다중주택", "업무시설 중 오피스텔", "숙박시설 중 다중생활시설", "제2종 근린생활시설 중 다중생활시설"], "a": 0, "v": "다중주택은 대상이 아님", "e": "단독주택 중 층간바닥 대상은 <b>다가구주택</b>이다. <b>다중주택은 제외</b>된다. 나머지 셋은 모두 조문에 그대로 열거되어 있다.", "s": "<b>다가구 ○ / 다중 ✕</b> 한 줄로 끝난다. 경계벽은 옆, 층간바닥은 위아래 — 같은 조의 다른 항.", "l": "건축법 제49조 제4항 · 시행령 제53조 제2항", "r": "5년간 3회 출제", "p": 208, "f": 209, "g": 6}, {"c": "12", "u": "비상용승강기 승강장", "q": "<b>비상용승강기 승강장</b>의 구조 기준에 관한 내용이 <b>틀린</b> 것은?", "o": ["채광이 되는 창문이 있거나 예비전원에 의한 조명설비를 할 것", "옥내에 설치하는 승강장의 바닥면적은 비상용승강기 1대에 대하여 6㎡ 이상으로 할 것", "피난층이 있는 승강장의 출입구로부터 도로 또는 공지에 이르는 거리가 50m 이하일 것", "벽 및 반자가 실내에 접하는 부분의 마감재료는 불연재료로 할 것"], "a": 2, "v": "50m가 아니라 30m 이하", "e": "피난층에 있는 승강장의 출입구(승강장이 없는 경우에는 <b>승강로의 출입구</b>)로부터 도로 또는 공지에 이르는 거리는 <b>30m 이하</b>여야 한다.", "s": "비상용의 다섯 숫자 — <b>31m · 1,500㎡ · 3,000㎡ · 6㎡ · 30m</b>. 승강장 6㎡는 피난용도 같다.", "l": "건축법 제64조 제2항 · 피난방화규칙 제10조 · 설비규칙 제9조", "r": "5년간 2회 출제 (피난용승강기 형태 포함 6회)", "p": 210, "f": 211, "g": 7}, {"c": "13", "u": "주차전용건축물", "q": "주차전용건축물의 주차면적비율과 관련한 다음 내용에서, ( )에 들어갈 수 <b>없는</b> 것은?<br>「주차전용건축물이란 건축물의 연면적 중 주차장으로 사용되는 부분의 비율이 95% 이상인 것을 말한다. 다만, 주차장 외의 용도로 사용되는 부분이 「건축법 시행령」 별표 1에 따른 ( )인 경우에는 70% 이상인 것을 말한다」", "o": ["종교시설", "운동시설", "업무시설", "숙박시설"], "a": 3, "v": "숙박시설", "e": "70%로 완화되는 용도 목록에 <b>숙박시설은 없다.</b> 목록은 단독주택·공동주택·제1·2종 근린생활시설·문화 및 집회시설·종교시설·판매시설·운수시설·운동시설·업무시설·창고시설·자동차 관련 시설이다.", "s": "목록을 다 외우기보다 <b>빠진 것</b>을 외운다 — 숙박 · 의료 · 위락 · 교육연구 · 노유자는 95%다.", "l": "주차장법 제2조 · 시행령 제1조의2", "r": "[2022 기사 2회 4번] · [2023 산업기사 2회 19번] · [2022 기사 1회 9번] · [09산] — 실측 4회차 중 3회 출제", "p": 214, "f": 215, "g": 1}, {"c": "13", "u": "주차단위구획", "q": "주차대수 1대에 대한 최소 주차단위구획의 면적이 가장 <b>넓은</b> 것은?", "o": ["직각주차형식(일반형)", "장애인전용 주차구획", "평행주차형식(일반형)", "주거지역의 보도와 차도의 구분이 없는 도로상의 평행주차형식"], "a": 1, "v": "장애인전용 3.3 × 5.0 = 16.5㎡", "e": "<b>장애인전용</b>은 너비 <b>3.3m</b> 이상 × 길이 5.0m 이상으로 <b>16.5㎡</b>. 평행주차 일반형(2.0×6.0=12㎡)이나 직각주차 일반형(2.5×5.0=12.5㎡)보다 넓다.", "s": "장애인전용만 <b>너비</b>가 3.3m로 튄다. 휠체어가 내릴 공간이 필요하기 때문이다.", "l": "주차장법 시행규칙 제3조", "r": "[06·08산] · [10·23산] · [2023 산업기사 3회 12번]", "p": 216, "f": 217, "g": 2}, {"c": "13", "u": "차로 너비", "q": "다음 중 노외주차장에 설치하여야 하는 차로의 최소 너비가 가장 <b>작은</b> 주차형식은? (이륜자동차전용 외의 노외주차장으로서 출입구가 2개 이상인 경우)", "o": ["직각주차", "교차주차", "평행주차", "60도 대향주차"], "a": 2, "v": "평행주차 3.3m", "e": "출입구가 2개 이상일 때 차로 너비는 <b>평행 3.3 → 45°·교차 3.5 → 60° 4.5 → 직각 6.0</b> 순으로 커진다. 차를 돌려 넣는 각도가 클수록 넓은 차로가 필요하다.", "s": "각도가 커질수록 차로가 넓어진다 — 3.3 / 3.5 / 4.5 / 6.0. 이 네 숫자가 전부다.", "l": "주차장법 시행규칙 제6조 ①항 3호", "r": "[15산] · [08산]", "p": 218, "f": 219, "g": 3}, {"c": "13", "u": "출입구", "q": "다음은 노외주차장의 구조·설비에 관한 기준이다. ( ) 안에 알맞은 것은?<br>「노외주차장의 출입구 너비는 (㉠) 이상으로 하여야 하며, 주차대수 규모가 50대 이상인 경우에는 출구와 입구를 분리하거나 너비 (㉡) 이상의 출입구를 설치하여 소통이 원활하도록 하여야 한다」", "o": ["㉠ 2.5m, ㉡ 4.5m", "㉠ 2.5m, ㉡ 5.5m", "㉠ 3.5m, ㉡ 4.5m", "㉠ 3.5m, ㉡ 5.5m"], "a": 3, "v": "㉠ 3.5m, ㉡ 5.5m", "e": "출입구 너비는 <b>3.5m</b> 이상이 원칙이고, <b>50대 이상</b>이면 출구·입구를 분리하거나 <b>5.5m</b> 이상으로 넓혀 양방향 통행이 되게 한다.", "s": "3.5 → (50대) → 5.5 → (400대) → 출구·입구 분리. 세 단계로 올라간다.", "l": "주차장법 시행규칙 제6조 ①항 4호·7호", "r": "[19·23산] · [06산]", "p": 220, "f": 221, "g": 4}, {"c": "13", "u": "출입구 설치 금지 장소", "q": "다음 중 노외주차장의 출구 및 입구를 설치할 수 <b>있는</b> 장소는?", "o": ["육교로부터 4m 거리에 있는 도로의 부분", "지하횡단보도에서 10m 거리에 있는 도로의 부분", "초등학교 출입구로부터 15m 거리에 있는 도로의 부분", "장애인 복지시설 출입구로부터 15m 거리에 있는 도로의 부분"], "a": 1, "v": "지하횡단보도에서 10m", "e": "횡단보도(육교·지하횡단보도 포함)에서는 <b>5m 이내</b>가 금지인데 <b>10m는 그 밖</b>이므로 설치할 수 있다.", "s": "거리 숫자가 둘뿐이다 — <b>횡단보도 5m</b>, <b>학교·복지시설 20m</b>. 어느 쪽 시설인지만 보면 된다.", "l": "주차장법 시행규칙 제6조 ①항 1호", "r": "[2023 산업기사 3회 18번] · [06산]", "p": 222, "f": 223, "g": 5}, {"c": "13", "u": "경사로", "q": "지하식 또는 건축물식 노외주차장의 차로에 관한 기준 내용으로 옳지 <b>않은</b> 것은?", "o": ["경사로의 노면은 이를 거친 면으로 하여야 한다", "높이는 주차바닥면으로부터 2.3m 이상으로 하여야 한다", "경사로의 종단경사도는 직선부분에서는 14%를 초과하여서는 아니 된다", "주차대수 규모가 50대 이상인 경우의 경사로는 너비 6m 이상인 2차선의 차로를 확보하거나 진입차로와 진출차로를 분리하여야 한다"], "a": 2, "v": "③번 지문", "e": "종단경사도는 <b>직선부분 17% 이하, 곡선부분 14% 이하</b>다. 14%는 <b>곡선</b>의 숫자인데 직선에 붙여 놓은 것이 이 문제의 함정이다.", "s": "곡선이 직선보다 완만해야 한다 — <b>직선 17% > 곡선 14%</b>. 순서만 기억하면 바꿔치기에 걸리지 않는다.", "l": "주차장법 시행규칙 제6조 ①항 5호", "r": "[10산] · [07산]", "p": 224, "f": 225, "g": 6}, {"c": "13", "u": "부대시설", "q": "다음은 노외주차장의 구조·설비기준 내용이다. ( ) 안에 알맞은 것은?<br>「노외주차장에 설치하는 부대시설의 총면적은 주차장 총시설면적(주차장으로 사용되는 면적과 주차장 외의 용도로 사용되는 면적을 합한 면적)의 ( )를 초과하여서는 아니 된다」", "o": ["5%", "10%", "15%", "20%"], "a": 3, "v": "20%", "e": "부대시설의 총면적은 주차장 총시설면적의 <b>20%</b>를 초과할 수 없다. 주차장이 다른 용도로 잠식되는 것을 막는 상한이다.", "s": "부대시설은 <b>20%</b>, 주차전용건축물은 <b>70/95%</b>. 둘 다 ‘주차장이 차지하는 비율’이지만 방향이 반대다.", "l": "주차장법 시행규칙 제6조 ①항 11호 · 시행령 제6조", "r": "[2023 산업기사 3회 5번] · [20·24산]", "p": 226, "f": 227, "g": 7}, {"c": "14", "u": "부설주차장 설치기준", "q": "부설주차장의 설치대상 시설물 종류와 설치기준의 연결이 옳지 <b>않은</b> 것은?", "o": ["위락시설 — 시설면적 100㎡당 1대", "판매시설 — 시설면적 150㎡당 1대", "숙박시설 — 시설면적 150㎡당 1대", "창고시설 — 시설면적 400㎡당 1대"], "a": 2, "v": "숙박시설은 200㎡당 1대", "e": "<b>숙박시설은 제1·2종 근린생활시설과 함께 200㎡당 1대</b>다. 150㎡ 칸에 들어가는 것은 문화 및 집회시설(관람장 제외)·종교·판매·운수·의료·운동·업무·방송국·장례식장이다.", "s": "칸이 여섯 — <b>100 · 150 · 200 · 300 · 350 · 400㎡</b>. 근생과 숙박이 같은 200㎡ 칸이다.", "l": "주차장법 시행령 제6조 · 별표 1", "r": "부설주차장 설치기준은 주차장법 단일 최다 빈출 — 거의 매 회차 출제", "p": 230, "f": 231, "g": 1}, {"c": "14", "u": "주차대수 계산", "q": "지상 5층 건축물로서 각 층 바닥면적이 1,000㎡이고, 1·2층은 제2종 근린생활시설, 3~5층은 업무시설인 경우 설치하여야 하는 <b>부설주차장의 최소 주차대수</b>는? (조례는 고려하지 않음)", "o": ["24대", "27대", "30대", "34대"], "a": 2, "v": "30대", "e": "용도별로 따로 계산한 뒤 더한다. 업무시설 3,000 ÷ 150 = <b>20대</b>, 제2종 근린생활시설 2,000 ÷ 200 = <b>10대</b>. 합 <b>30대</b>.", "s": "섞인 건물은 <b>연면적 ÷ 하나의 기준</b>이 아니다. 5,000 ÷ 150 = 33.3대로 풀면 틀린다. 칸마다 나누고 마지막에 더한다.", "l": "주차장법 시행령 제6조 · 별표 1", "r": "계산형 문항은 기사·산업기사 공통 출제 유형", "p": 232, "f": 233, "g": 2}, {"c": "14", "u": "인근 설치", "q": "부설주차장을 시설물의 부지 인근에 설치할 수 있는 경우에 관한 기준 내용으로 옳은 것은?", "o": ["주차대수 200대 이하, 직선거리 200m 이내", "주차대수 300대 이하, 직선거리 300m 이내 또는 도보거리 600m 이내", "주차대수 300대 이하, 직선거리 600m 이내 또는 도보거리 300m 이내", "주차대수 400대 이하, 직선거리 300m 이내"], "a": 1, "v": "300대 이하 · 직선 300m / 도보 600m", "e": "부설주차장이 <b>주차대수 300대 이하</b>이면 시설물의 부지 인근에 단독 또는 공동으로 설치할 수 있다. 인근의 범위는 <b>직선거리 300m 이내 또는 도보거리 600m 이내</b>다.", "s": "<b>직선은 짧고(300), 도보는 길다(600).</b> 둘 중 하나만 충족하면 되고, 거리는 부지 경계선에서 주차장 경계선까지 잰다.", "l": "주차장법 제19조 ④항 · 시행령 제7조", "r": "300 / 300 / 600 세 숫자만 묻는 문항", "p": 234, "f": 235, "g": 3}, {"c": "14", "u": "8대 이하 특례", "q": "주차대수 8대 이하인 자주식주차장(부설주차장)의 구조 및 설비기준으로 옳지 <b>않은</b> 것은?", "o": ["차로의 너비는 2.5m 이상으로 한다", "주차단위구획과 접하여 있는 차로가 직각주차형식인 경우 그 차로의 너비는 6m 이상으로 한다", "주차단위구획과 접하여 있는 차로가 평행주차형식인 경우 그 차로의 너비는 3.3m 이상으로 한다", "출입구의 너비는 3m 이상으로 한다"], "a": 2, "v": "평행주차는 3.0m 이상", "e": "8대 이하 부설주차장에서 주차단위구획과 접한 차로는 <b>평행 3.0 / 45°·교차 3.5 / 60° 4.0 / 직각 6.0</b>이다. <b>3.3m는 노외주차장</b>의 평행주차 숫자다.", "s": "노외와 달라지는 것은 <b>평행(3.3→3.0)과 60°(4.5→4.0) 둘뿐</b>이고, 출입구는 3.5m가 아니라 <b>3m</b>다.", "l": "주차장법 시행규칙 제11조 ⑤항", "r": "노외주차장 차로 너비와 짝지어 출제된다", "p": 236, "f": 237, "g": 4}, {"c": "14", "u": "노상주차장", "q": "노상주차장을 설치할 수 <b>있는</b> 도로는? (조례에 따른 예외는 고려하지 않음)", "o": [ const M='①②③④';
let set=[], cur=0, score=0, results=[], label='', lastMode=null;

function saveDone(k,v){ done[k]=v; try{ localStorage.setItem('grimlaw_done', JSON.stringify(done)); }catch(e){} }

function drawGrid(){
  document.getElementById('chGrid').innerHTML = CHAP.map(c=>{
    const d = done[c.no]; const tag = d!==undefined ? `<span class="done">· 최근 ${d}/${c.n}</span>` : '';

  }).join('');
}
function prep(list){
  return list.map(q=>{ const idx=[0,1,2,3].sort(()=>Math.random()-.5);
    return Object.assign({}, q, {opts: idx.map(i=>q.o[i]), ans: idx.indexOf(q.a)}); });
}
function begin(list, lab, mode){
  set=prep(list); cur=0; score=0; results=[]; label=lab; lastMode=mode;
  document.getElementById('scrStart').classList.add('hidden');
  document.getElementById('scrResult').classList.add('hidden');
  document.getElementById('scrQuiz').classList.remove('hidden');
  showQ(); window.scrollTo(0,0);
}
function startCh(no){ const c=CHAP.find(x=>x.no===no); begin(DATA.filter(q=>q.c===no), `CHAPTER ${no} · ${c.t}`, {ch:no}); }
function startMock(){ const pool=[...DATA].sort(()=>Math.random()-.5).slice(0,20); begin(pool, '실전 모의 20문항', {mock:true}); }
function retry(){ lastMode.mock ? startMock() : startCh(lastMode.ch); }
function toStart(){ document.getElementById('scrResult').classList.add('hidden'); document.getElementById('scrStart').classList.remove('hidden'); drawGrid(); window.scrollTo(0,0); }

  document.getElementById('qExplain').classList.add('hidden');
  document.getElementById('btnNext').classList.add('hidden');

function pick(i,btn){

  if(!ok) btn.classList.add('wrong');
  const ex=document.getElementById('qExplain');
  ex.innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ok?'정답입니다':'아쉽네요 — 정답은 '+q.L[q.ans]+' '+q.v}</div>

  ex.classList.remove('hidden');
  const nb=document.getElementById('btnNext');
  nb.textContent=(cur===set.length-1)?'결과 보기':'다음 문제'; nb.classList.remove('hidden');

}

  if(lastMode.ch) saveDone(lastMode.ch, score);
  document.getElementById('rMsg').textContent = lastMode.mock
    ? (score>=12 ? `합격선(12문항) 통과! 틀린 ${n-score}문항의 그림만 다시 보면 된다.` : `합격선까지 ${12-score}문항. 틀린 문제의 개념도부터 펴 보자.`)
    : (pct>=.85 ? '이 챕터는 잡았다. SUMMARY 한 장으로 마무리.' : pct>=.6 ? '절반 넘게 맞혔다. 틀린 문항의 그림만 확인하자.' : '이 챕터는 그림부터 보고 다시 풀어 보자.');
  const wrong=results.filter(r=>!r.ok);
  document.getElementById('rReview').innerHTML = results.map((r,i)=>
    `<div class="rv"><span class="mark ${r.ok?'ok':'no'}">${r.ok?'O':'X'}</span><span>${i+1}. ${r.q.u}</span>${r.ok?'':`<span class="p">개념도 p.${r.q.f}</span>`}</div>`).join('');
  const pages = wrong.map(r=>'p.'+r.q.f).join(' · ');
  const buy = BUY_URL ? `<a class="btn warm" href="${BUY_URL}" target="_blank" rel="noopener">『그림으로 푸는 건축법규』 보러 가기</a>`
                      : `<p style="margin-top:8px"><b style="display:inline;font-size:14px">유페이퍼</b>에서 「그림으로 푸는 건축법규」를 검색하세요.</p>`;
  document.getElementById('rCta').innerHTML = (wrong.length
      ? `<b>틀린 ${wrong.length}문항, 그림으로 다시 보기</b><p>${pages}</p>`
      : `<b>전부 맞혔다</b><p>다른 챕터도 이어서 풀어 보자.</p>`)
    + `<p style="margin-top:8px">숫자가 왜 그 숫자인지 — 문항마다 개념도 한 장이 붙은 책, 245쪽 · 개념도 113장</p>` + buy;
  window.scrollTo(0,0);
}
drawGrid();
</script>
</body>
</html>
